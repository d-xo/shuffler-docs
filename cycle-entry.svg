<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="eB" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
    <marker id="eA" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="eG" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/>
    </marker>
    <marker id="eS" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="1090" rx="12" fill="#0f172a"/>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Why Entering a Cycle Expands It to Include the Top</text>
  <text x="500" y="63" text-anchor="middle" font-size="12" fill="#94a3b8">the merge half of the surgery: one swap splices the top into the ring, rerouting exactly two arrows</text>

  <!-- claim -->
  <rect x="60" y="80" width="880" height="58" rx="10" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="104" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#e2e8f0">Claim</tspan> &#183; if the top t is a fixed point and x lies in a foreign cycle C of length m, then swapping t &#8596; x yields a single</text>
  <text x="80" y="126" font-size="12" fill="#cbd5e1">cycle of length m + 1 whose members are exactly {t} &#8746; C &#8212; and it physically moves only the two slots at t and x.</text>

  <!-- ===== 1 · structurally ===== -->
  <text x="60" y="174" font-size="12.5" font-weight="700" fill="#e2e8f0">1 &#183; the merge, structurally &#8212; a splice, not a shuffle</text>

  <!-- t fixed, apart -->
  <path d="M 130 194 C 122 172, 158 172, 150 193" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#eG)"/>
  <circle cx="140" cy="205" r="14" fill="#12261c" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="140" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#fbbf24">t</text>
  <text x="140" y="238" text-anchor="middle" font-size="9" fill="#4ade80">dest[t] = t</text>

  <!-- swap chord -->
  <line x1="152" y1="215" x2="210" y2="242" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#eA)" marker-end="url(#eA)"/>

  <!-- before ring (x1 x2 x3 x4) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 236.3 252.7 A 50 50 0 0 1 267.3 283.7" marker-end="url(#eB)"/>
    <path d="M 267.3 316.3 A 50 50 0 0 1 236.3 347.3" marker-end="url(#eB)"/>
    <path d="M 203.7 347.3 A 50 50 0 0 1 172.7 316.3" marker-end="url(#eB)"/>
    <path d="M 172.7 283.7 A 50 50 0 0 1 203.7 252.7" marker-end="url(#eB)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <circle cx="220" cy="250" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="220" y="254" fill="#7dd3fc">x&#8321;</text>
    <circle cx="270" cy="300" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="270" y="304" fill="#7dd3fc">x&#8322;</text>
    <circle cx="220" cy="350" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="220" y="354" fill="#7dd3fc">x&#8323;</text>
    <circle cx="170" cy="300" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="304" fill="#7dd3fc">x&#8324;</text>
  </g>
  <text x="220" y="392" text-anchor="middle" font-size="10" fill="#64748b">C = (x&#8321; x&#8322; x&#8323; x&#8324;) &#183; m = 4 &#183; t not a member</text>

  <!-- transition -->
  <line x1="340" y1="292" x2="460" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#eS)"/>
  <text x="400" y="277" text-anchor="middle" font-size="10" fill="#94a3b8">swap t &#8596; x&#8321;</text>
  <text x="400" y="312" text-anchor="middle" font-size="9" fill="#64748b">different cycles &#8658; merge</text>
  <text x="400" y="326" text-anchor="middle" font-size="9" fill="#64748b">(surgery lemma)</text>

  <!-- after ring (t x2 x3 x4 x1) -->
  <g fill="none">
    <path d="M 775.5 237.0 A 60 60 0 0 1 810.3 262.3" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#eA)"/>
    <path d="M 819.9 291.9 A 60 60 0 0 1 806.6 332.8" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 781.5 351.0 A 60 60 0 0 1 738.5 351.0" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 713.4 332.8 A 60 60 0 0 1 700.1 291.9" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 709.7 262.3 A 60 60 0 0 1 744.5 237.0" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#eA)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <circle cx="760" cy="235" r="13" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="760" y="239" fill="#fbbf24">t</text>
    <circle cx="817.1" cy="276.5" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="817.1" y="280.5" fill="#7dd3fc">x&#8322;</text>
    <circle cx="795.3" cy="343.5" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="795.3" y="347.5" fill="#7dd3fc">x&#8323;</text>
    <circle cx="724.7" cy="343.5" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="724.7" y="347.5" fill="#7dd3fc">x&#8324;</text>
    <circle cx="702.9" cy="276.5" r="13" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="702.9" y="280.5" fill="#7dd3fc">x&#8321;</text>
  </g>
  <text x="846" y="243" font-size="8.5" fill="#fbbf24">new</text>
  <text x="666" y="243" text-anchor="end" font-size="8.5" fill="#fbbf24">new</text>
  <text x="760" y="372" text-anchor="middle" font-size="8.5" fill="#7dd3fc">unchanged</text>
  <text x="760" y="404" text-anchor="middle" font-size="10" fill="#64748b">(t x&#8322; x&#8323; x&#8324; x&#8321;) &#183; length m + 1 &#183; t spliced between x&#8321; and x&#8322;</text>

  <!-- ===== 2 · entry by entry ===== -->
  <text x="60" y="446" font-size="12.5" font-weight="700" fill="#e2e8f0">2 &#183; entry by entry</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#cbd5e1">
    <text x="60" y="472">dest&#8242;[t]&#160;&#160;= dest[x&#8321;] = x&#8322;&#160;&#160;<tspan fill="#fbbf24">&#8594; t inherits x&#8321;'s outgoing arrow</tspan></text>
    <text x="60" y="492">dest&#8242;[x&#8321;] = dest[t]&#160;&#160;= t&#160;&#160;&#160;<tspan fill="#fbbf24">&#8594; x&#8321; now points at the top</tspan></text>
    <text x="60" y="512">every other entry &#8212; including x&#8322; &#8230; x&#8324;'s &#8212; is untouched, by the definition of a swap</text>
    <text x="60" y="532">trace from t: t &#8594; x&#8322; &#8594; x&#8323; &#8594; x&#8324; &#8594; x&#8321; &#8594; t&#160;&#160;<tspan fill="#4ade80">one closed loop &#183; length m + 1 &#183; contains t &#10003;</tspan></text>
  </g>

  <!-- ===== 3 · concrete stack ===== -->
  <text x="60" y="576" font-size="12.5" font-weight="700" fill="#e2e8f0">3 &#183; on a concrete stack &#8212; dest = [0 3 1 2 4 5], top = 5 home, entering C = (1 3 2) at x = 3</text>

  <g font-size="8.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="102" y="600">5&#183;t</text><text x="102" y="636">4</text><text x="102" y="672">3</text>
    <text x="102" y="708">2</text><text x="102" y="744">1</text><text x="102" y="780">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle">
    <rect x="110" y="580" width="96" height="30" rx="5" fill="#12261c" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="158" y="600" fill="#4ade80">f &#8594;5 &#10003;</text>
    <rect x="110" y="616" width="96" height="30" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.4"/>
    <text x="158" y="636" fill="#4ade80">e &#8594;4 &#10003;</text>
    <rect x="107" y="649" width="102" height="36" rx="7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="110" y="652" width="96" height="30" rx="5" fill="#16324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="158" y="672" fill="#7dd3fc">d &#8594;2</text>
    <rect x="110" y="688" width="96" height="30" rx="5" fill="#16324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="158" y="708" fill="#7dd3fc">c &#8594;1</text>
    <rect x="110" y="724" width="96" height="30" rx="5" fill="#16324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="158" y="744" fill="#7dd3fc">b &#8594;3</text>
    <rect x="110" y="760" width="96" height="30" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.4"/>
    <text x="158" y="780" fill="#4ade80">a &#8594;0 &#10003;</text>
  </g>

  <line x1="240" y1="682" x2="392" y2="682" stroke="#64748b" stroke-width="1.5" marker-end="url(#eS)"/>
  <text x="316" y="668" text-anchor="middle" font-size="10" fill="#94a3b8">SWAP2 &#183; t &#8596; 3</text>
  <text x="316" y="700" text-anchor="middle" font-size="9" fill="#64748b">(the shallowest</text>
  <text x="316" y="713" text-anchor="middle" font-size="9" fill="#64748b">misplaced slot)</text>

  <g font-size="8.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="412" y="600">5&#183;t</text><text x="412" y="636">4</text><text x="412" y="672">3</text>
    <text x="412" y="708">2</text><text x="412" y="744">1</text><text x="412" y="780">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle">
    <rect x="420" y="580" width="96" height="30" rx="5" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="468" y="600" fill="#fbbf24">d &#8594;2</text>
    <rect x="420" y="616" width="96" height="30" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.4"/>
    <text x="468" y="636" fill="#4ade80">e &#8594;4 &#10003;</text>
    <rect x="420" y="652" width="96" height="30" rx="5" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="468" y="672" fill="#fbbf24">f &#8594;5</text>
    <rect x="420" y="688" width="96" height="30" rx="5" fill="#16324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="468" y="708" fill="#7dd3fc">c &#8594;1</text>
    <rect x="420" y="724" width="96" height="30" rx="5" fill="#16324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="468" y="744" fill="#7dd3fc">b &#8594;3</text>
    <rect x="420" y="760" width="96" height="30" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.4"/>
    <text x="468" y="780" fill="#4ade80">a &#8594;0 &#10003;</text>
  </g>

  <!-- annotations -->
  <g font-size="11" fill="#94a3b8">
    <circle cx="566" cy="606" r="4" fill="#fbbf24"/>
    <text x="580" y="610">physically moved: only the slots at t and x &#8212;</text>
    <text x="580" y="626"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">f</tspan> goes down to 3, <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">d</tspan> comes up to the top</text>
    <circle cx="566" cy="656" r="4" fill="#38bdf8"/>
    <text x="580" y="660">positions 1 and 2 join the longer cycle without being</text>
    <text x="580" y="676">touched: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">b &#8594;3</tspan> and <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">c &#8594;1</tspan> are bit-identical before and after</text>
    <circle cx="566" cy="706" r="4" fill="#4ade80"/>
    <text x="580" y="710">positions 0 and 4 lie outside {t} &#8746; C &#8212; untouched entirely</text>
    <circle cx="566" cy="740" r="4" fill="#c084fc"/>
    <text x="580" y="744">the top is no longer fixed: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">dest&#8242;[5] = 2</tspan> re-arms the loop,</text>
    <text x="580" y="760">and the resolution proof takes over from here</text>
  </g>

  <!-- two-line notations -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="97" y="856" font-size="34" fill="#475569">(</text>
    <text x="213" y="856" font-size="34" fill="#475569">)</text>
    <g font-size="10" text-anchor="middle" fill="#94a3b8">
      <text x="113" y="828">0</text><text x="131" y="828">1</text><text x="149" y="828">2</text><text x="167" y="828">3</text><text x="185" y="828">4</text><text x="203" y="828">5</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <text x="113" y="848" fill="#4ade80">0</text><text x="131" y="848" fill="#7dd3fc">3</text><text x="149" y="848" fill="#7dd3fc">1</text><text x="167" y="848" fill="#7dd3fc">2</text><text x="185" y="848" fill="#4ade80">4</text><text x="203" y="848" fill="#4ade80">5</text>
    </g>
    <text x="407" y="856" font-size="34" fill="#475569">(</text>
    <text x="523" y="856" font-size="34" fill="#475569">)</text>
    <g font-size="10" text-anchor="middle" fill="#94a3b8">
      <text x="423" y="828">0</text><text x="441" y="828">1</text><text x="459" y="828">2</text><text x="477" y="828">3</text><text x="495" y="828">4</text><text x="513" y="828">5</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <text x="423" y="848" fill="#4ade80">0</text><text x="441" y="848" fill="#7dd3fc">3</text><text x="459" y="848" fill="#7dd3fc">1</text><text x="477" y="848" fill="#fbbf24">5</text><text x="495" y="848" fill="#4ade80">4</text><text x="513" y="848" fill="#fbbf24">2</text>
    </g>
  </g>
  <text x="158" y="880" text-anchor="middle" font-size="10" fill="#64748b">(1 3 2) &#183; fixed: 0 4 <tspan fill="#fbbf24">5</tspan></text>
  <text x="468" y="880" text-anchor="middle" font-size="10" fill="#64748b">(5 2 1 3) &#183; fixed: 0 4 &#183; <tspan fill="#fbbf24">two entries changed</tspan></text>

  <!-- ===== 4 · what is disturbed ===== -->
  <line x1="60" y1="906" x2="940" y2="906" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="934" font-size="12.5" font-weight="700" fill="#e2e8f0">4 &#183; what is &#8212; and is not &#8212; disturbed</text>
  <g font-size="11" fill="#94a3b8">
    <text x="60" y="960"><tspan fill="#e2e8f0" font-weight="600">1</tspan> &#183; a swap changes exactly two entries, t's and x's &#8212; that is the entire physical event</text>
    <text x="60" y="980"><tspan fill="#e2e8f0" font-weight="600">2</tspan> &#183; t sat in its own 1-cycle and x in C &#8212; different cycles, so the surgery lemma says merge; the trace t &#8594; x&#8322; &#8594; &#8943; &#8594; x&#8321; &#8594; t exhibits the loop</text>
    <text x="60" y="1000"><tspan fill="#e2e8f0" font-weight="600">3</tspan> &#183; membership is exactly {t} &#8746; C: no outsider's arrow was rerouted, so none joined; every member of C lies on the traced loop, so none left&#160;&#160;<tspan fill="#4ade80">&#8718;</tspan></text>
    <text x="60" y="1028" fill="#fbbf24">cost accounting: this swap is the entry toll &#8212; the (m+1)-cycle through t then resolves in m swaps (previous proof), so a foreign m-cycle costs m + 1 in total</text>
  </g>

  <text x="940" y="1064" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Shuffler.cpp &#183; Emission::permute &#183; the &#8220;top is home&#8221; branch</text>
</svg>
