<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="eB" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58c4dd"/>
    </marker>
    <marker id="eA" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f7d96f"/>
    </marker>
    <marker id="eG" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#83c167"/>
    </marker>
    <marker id="eS" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="1000" height="860" rx="12" fill="#000000"/>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Why Entering a Cycle Expands It to Include the Top</text>
  <text x="500" y="63" text-anchor="middle" font-size="12" fill="#bbbbbb">the merge half of the surgery: one swap splices the top into the ring, rerouting exactly two arrows</text>

  <!-- claim -->
  <rect x="60" y="80" width="880" height="58" rx="10" fill="#0d0d0d" stroke="#444444" stroke-width="1.5"/>
  <text x="80" y="104" font-size="12" fill="#dddddd"><tspan font-weight="700" fill="#ffffff">Claim</tspan> &#183; if the top t is in place and x lies in a foreign cycle C of length m, then swapping t &#8596; x yields a single</text>
  <text x="80" y="126" font-size="12" fill="#dddddd">cycle of length m + 1 whose members are exactly {t} &#8746; C &#8212; and it physically moves only the two slots at t and x.</text>

  <!-- ===== 1 · structurally ===== -->
  <text x="60" y="174" font-size="12.5" font-weight="700" fill="#ffffff">1 &#183; the merge, structurally &#8212; a splice, not a shuffle</text>

  <!-- t in place, apart -->
  <path d="M 130 194 C 122 172, 158 172, 150 193" fill="none" stroke="#83c167" stroke-width="1.5" marker-end="url(#eG)"/>
  <circle cx="140" cy="205" r="14" fill="#1c2a16" stroke="#f7d96f" stroke-width="1.8"/>
  <text x="140" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#f7d96f">t</text>
  <text x="140" y="238" text-anchor="middle" font-size="9" fill="#83c167">dest[t] = t</text>

  <!-- swap chord -->
  <line x1="152" y1="215" x2="210" y2="242" stroke="#f7d96f" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#eA)" marker-end="url(#eA)"/>

  <!-- before ring (x1 x2 x3 x4) -->
  <g stroke="#58c4dd" stroke-width="1.5" fill="none">
    <path d="M 236.3 252.7 A 50 50 0 0 1 267.3 283.7" marker-end="url(#eB)"/>
    <path d="M 267.3 316.3 A 50 50 0 0 1 236.3 347.3" marker-end="url(#eB)"/>
    <path d="M 203.7 347.3 A 50 50 0 0 1 172.7 316.3" marker-end="url(#eB)"/>
    <path d="M 172.7 283.7 A 50 50 0 0 1 203.7 252.7" marker-end="url(#eB)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <circle cx="220" cy="250" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="220" y="254" fill="#9cdceb">x&#8321;</text>
    <circle cx="270" cy="300" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="270" y="304" fill="#9cdceb">x&#8322;</text>
    <circle cx="220" cy="350" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="220" y="354" fill="#9cdceb">x&#8323;</text>
    <circle cx="170" cy="300" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="170" y="304" fill="#9cdceb">x&#8324;</text>
  </g>
  <text x="220" y="392" text-anchor="middle" font-size="10" fill="#888888">C = (x&#8321; x&#8322; x&#8323; x&#8324;) &#183; m = 4 &#183; t not a member</text>

  <!-- transition -->
  <line x1="340" y1="292" x2="460" y2="292" stroke="#888888" stroke-width="1.5" marker-end="url(#eS)"/>
  <text x="400" y="277" text-anchor="middle" font-size="10" fill="#bbbbbb">swap t &#8596; x&#8321;</text>
  <text x="400" y="312" text-anchor="middle" font-size="9" fill="#888888">different cycles &#8658; merge</text>
  <text x="400" y="326" text-anchor="middle" font-size="9" fill="#888888">(surgery lemma)</text>

  <!-- after ring (t x2 x3 x4 x1) -->
  <g fill="none">
    <path d="M 775.5 237.0 A 60 60 0 0 1 810.3 262.3" stroke="#f7d96f" stroke-width="1.8" marker-end="url(#eA)"/>
    <path d="M 819.9 291.9 A 60 60 0 0 1 806.6 332.8" stroke="#58c4dd" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 781.5 351.0 A 60 60 0 0 1 738.5 351.0" stroke="#58c4dd" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 713.4 332.8 A 60 60 0 0 1 700.1 291.9" stroke="#58c4dd" stroke-width="1.5" marker-end="url(#eB)"/>
    <path d="M 709.7 262.3 A 60 60 0 0 1 744.5 237.0" stroke="#f7d96f" stroke-width="1.8" marker-end="url(#eA)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <circle cx="760" cy="235" r="13" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="760" y="239" fill="#f7d96f">t</text>
    <circle cx="817.1" cy="276.5" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="817.1" y="280.5" fill="#9cdceb">x&#8322;</text>
    <circle cx="795.3" cy="343.5" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="795.3" y="347.5" fill="#9cdceb">x&#8323;</text>
    <circle cx="724.7" cy="343.5" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="724.7" y="347.5" fill="#9cdceb">x&#8324;</text>
    <circle cx="702.9" cy="276.5" r="13" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="702.9" y="280.5" fill="#9cdceb">x&#8321;</text>
  </g>
  <text x="846" y="243" font-size="8.5" fill="#f7d96f">new</text>
  <text x="666" y="243" text-anchor="end" font-size="8.5" fill="#f7d96f">new</text>
  <text x="760" y="372" text-anchor="middle" font-size="8.5" fill="#9cdceb">unchanged</text>
  <text x="760" y="404" text-anchor="middle" font-size="10" fill="#888888">(t x&#8322; x&#8323; x&#8324; x&#8321;) &#183; length m + 1 &#183; t spliced between x&#8321; and x&#8322;</text>

  <!-- ===== 2 · nothing outside t and x1 is disturbed ===== -->
  <line x1="60" y1="440" x2="940" y2="440" stroke="#222222" stroke-width="1"/>
  <text x="60" y="470" font-size="15" font-weight="700" fill="#ffffff">2 &#183; nothing outside t and x&#8321; is disturbed</text>
  <text x="60" y="492" font-size="11" fill="#bbbbbb">swap t &#8596; x&#8321; on <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">dest = [0 3 1 2 4 5]</tspan> &#183; t = 5 &#183; C = (1 3 2) &#183; x&#8321; = 3 &#8212; the amber entries cross, every other cell is bit-identical</text>

  <!-- before row -->
  <text x="72" y="530" text-anchor="end" font-size="9.5" fill="#888888">before</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="80" y="505" width="76" height="40" rx="6" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="118" y="530" fill="#83c167">&#8594;0 &#10003;</text>
    <rect x="170" y="505" width="76" height="40" rx="6" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="208" y="530" fill="#9cdceb">&#8594;3</text>
    <rect x="260" y="505" width="76" height="40" rx="6" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="298" y="530" fill="#9cdceb">&#8594;1</text>
    <rect x="350" y="505" width="76" height="40" rx="6" fill="#17313d" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="388" y="530" fill="#9cdceb">&#8594;2</text>
    <rect x="440" y="505" width="76" height="40" rx="6" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="478" y="530" fill="#83c167">&#8594;4 &#10003;</text>
    <rect x="530" y="505" width="76" height="40" rx="6" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="568" y="530" fill="#f7d96f">&#8594;5 &#10003;</text>
  </g>

  <!-- the two entries cross; everything else is identical -->
  <line x1="388" y1="549" x2="558" y2="587" stroke="#f7d96f" stroke-width="1.6" marker-end="url(#eA)"/>
  <line x1="568" y1="549" x2="398" y2="587" stroke="#f7d96f" stroke-width="1.6" marker-end="url(#eA)"/>
  <g>
    <circle cx="118" cy="568" r="9" fill="#000000" stroke="#444444" stroke-width="1.2"/>
    <circle cx="208" cy="568" r="9" fill="#000000" stroke="#444444" stroke-width="1.2"/>
    <circle cx="298" cy="568" r="9" fill="#000000" stroke="#444444" stroke-width="1.2"/>
    <circle cx="478" cy="568" r="9" fill="#000000" stroke="#444444" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#888888" text-anchor="middle">
    <text x="118" y="572">=</text>
    <text x="208" y="572">=</text>
    <text x="298" y="572">=</text>
    <text x="478" y="572">=</text>
  </g>

  <!-- after row -->
  <text x="72" y="620" text-anchor="end" font-size="9.5" fill="#888888">after</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="80" y="595" width="76" height="40" rx="6" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="118" y="620" fill="#83c167">&#8594;0 &#10003;</text>
    <rect x="170" y="595" width="76" height="40" rx="6" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="208" y="620" fill="#9cdceb">&#8594;3</text>
    <rect x="260" y="595" width="76" height="40" rx="6" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="298" y="620" fill="#9cdceb">&#8594;1</text>
    <rect x="350" y="595" width="76" height="40" rx="6" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="388" y="620" fill="#f7d96f">&#8594;5</text>
    <rect x="440" y="595" width="76" height="40" rx="6" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="478" y="620" fill="#83c167">&#8594;4 &#10003;</text>
    <rect x="530" y="595" width="76" height="40" rx="6" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="568" y="620" fill="#f7d96f">&#8594;2</text>
  </g>

  <!-- position + role labels -->
  <g font-size="9" fill="#888888" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="118" y="655">0</text><text x="208" y="655">1</text><text x="298" y="655">2</text>
    <text x="388" y="655">3</text><text x="478" y="655">4</text><text x="568" y="655">5&#183;top</text>
  </g>
  <g font-size="8.5" text-anchor="middle">
    <text x="118" y="671" fill="#83c167">in place</text>
    <text x="208" y="671" fill="#9cdceb">&#8712; C</text>
    <text x="298" y="671" fill="#9cdceb">&#8712; C</text>
    <text x="388" y="671" fill="#f7d96f">x&#8321; &#8712; C</text>
    <text x="478" y="671" fill="#83c167">in place</text>
    <text x="568" y="671" fill="#f7d96f">t</text>
  </g>

  <!-- side annotations -->
  <g font-size="11" fill="#bbbbbb">
    <text x="660" y="518">before &#183; cycles: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9cdceb">(1 3 2)</tspan> &#183; in place: 0 4 5</text>
    <text x="660" y="538">after &#183; one cycle: <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#f7d96f">(5 2 1 3)</tspan> &#183; in place: 0 4</text>
    <circle cx="666" cy="566" r="4" fill="#9a72ac"/>
    <text x="680" y="570">the top is no longer in place:</text>
    <text x="680" y="586"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">dest&#8242;[5] = 2</tspan> re-arms the loop, and the</text>
    <text x="680" y="602">resolution proof takes over from here</text>
  </g>

  <!-- the argument -->
  <g font-size="11" fill="#bbbbbb">
    <text x="60" y="706"><tspan fill="#ffffff" font-weight="600">1</tspan> &#183; a swap rewrites exactly two entries &#8212; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">dest&#8242;[t] = dest[x&#8321;] = x&#8322;</tspan> (t inherits x&#8321;'s outgoing arrow) &#183; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">dest&#8242;[x&#8321;] = dest[t] = t</tspan> (x&#8321; now points at the top)</text>
    <text x="60" y="726"><tspan fill="#ffffff" font-weight="600">2</tspan> &#183; t was in place &#8212; its own 1-cycle &#8212; and x&#8321; lay in C: different cycles, so the swap merges them into the single loop t &#8594; x&#8322; &#8594; &#8943; &#8594; x&#8321; &#8594; t of length m + 1</text>
    <text x="60" y="746"><tspan fill="#ffffff" font-weight="600">3</tspan> &#183; x&#8322; &#8230; x&#8324; join the longer cycle without being touched: their entries are bit-identical before and after &#8212; only their cycle label changed, not their data</text>
    <text x="60" y="766"><tspan fill="#ffffff" font-weight="600">4</tspan> &#183; slots outside {t} &#8746; C (here 0 and 4) are untouched entirely and stay in place: no outsider's arrow was rerouted, so none joined; every member of C lies on the traced loop, so none left&#160;&#160;<tspan fill="#83c167">&#8718;</tspan></text>
    <text x="60" y="794" fill="#f7d96f">cost accounting: this swap is the entry toll &#8212; the (m+1)-cycle through t then resolves in m swaps (previous proof), so a foreign m-cycle costs m + 1 in total</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="812" x2="940" y2="812" stroke="#222222" stroke-width="1"/>
  <text x="940" y="836" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">Shuffler.cpp &#183; Emission::permute &#183; the &#8220;top is home&#8221; branch</text>
</svg>
