<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrGreen" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#f87171"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#c084fc"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="640" rx="12" fill="#0f172a"/>

  <!-- title -->
  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">The EVM Stack</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#94a3b8">LIFO &#183; 32-byte words &#183; max depth 1024 &#183; one stack per call context</text>

  <!-- stack slots -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14">
    <!-- item 1 (top) -->
    <rect x="380" y="120" width="220" height="44" rx="6" fill="#1d3350" stroke="#38bdf8" stroke-width="2"/>
    <text x="490" y="147" text-anchor="middle" fill="#e2e8f0">0xdeadbeef</text>
    <!-- item 2 -->
    <rect x="380" y="170" width="220" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="197" text-anchor="middle" fill="#cbd5e1">0x00&#8230;0020</text>
    <!-- item 3 -->
    <rect x="380" y="220" width="220" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="247" text-anchor="middle" fill="#cbd5e1">0x00&#8230;00a4</text>
    <!-- item 4 -->
    <rect x="380" y="270" width="220" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="297" text-anchor="middle" fill="#cbd5e1">0xc0ffee</text>
    <!-- ellipsis -->
    <text x="490" y="342" text-anchor="middle" font-size="18" fill="#64748b">&#8942;</text>
    <!-- item 16 -->
    <rect x="380" y="356" width="220" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="383" text-anchor="middle" fill="#cbd5e1">0x00&#8230;0001</text>
    <!-- ellipsis -->
    <text x="490" y="428" text-anchor="middle" font-size="18" fill="#64748b">&#8942;</text>
    <!-- item 1024 (bottom) -->
    <rect x="380" y="440" width="220" height="44" rx="6" fill="#16202f" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="490" y="467" text-anchor="middle" fill="#64748b">0x00&#8230;0000</text>
  </g>

  <!-- depth labels -->
  <g font-size="13" fill="#94a3b8" text-anchor="end">
    <text x="366" y="147">0 &#183; top</text>
    <text x="366" y="197">1</text>
    <text x="366" y="247">2</text>
    <text x="366" y="297">3</text>
    <text x="366" y="383">15</text>
    <text x="366" y="467">1023</text>
  </g>

  <!-- base line -->
  <line x1="372" y1="494" x2="608" y2="494" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- PUSH -->
  <line x1="270" y1="128" x2="372" y2="138" stroke="#4ade80" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="262" y="122" text-anchor="end" font-size="15" font-weight="700" fill="#4ade80">PUSH0 &#8230; PUSH32</text>
  <text x="262" y="140" text-anchor="end" font-size="12" fill="#94a3b8">place an n-byte constant on top</text>

  <!-- POP -->
  <line x1="372" y1="156" x2="270" y2="176" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="262" y="182" text-anchor="end" font-size="15" font-weight="700" fill="#f87171">POP</text>
  <text x="262" y="200" text-anchor="end" font-size="12" fill="#94a3b8">discard the top item</text>

  <!-- left note -->
  <text x="262" y="252" text-anchor="end" font-size="12" fill="#64748b">items enter and leave</text>
  <text x="262" y="268" text-anchor="end" font-size="12" fill="#64748b">only at the top</text>

  <!-- DUP curve: item 3 copied to top (e.g. DUP3) -->
  <path d="M 604 242 C 658 242, 658 140, 608 134" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrViolet)"/>
  <text x="650" y="192" font-size="11" fill="#c084fc">e.g. DUP3</text>

  <!-- SWAP curve: top exchanged with item 4 (e.g. SWAP3) -->
  <path d="M 606 152 C 692 162, 692 278, 606 288" fill="none" stroke="#fbbf24" stroke-width="2" marker-start="url(#arrAmber)" marker-end="url(#arrAmber)"/>
  <text x="686" y="226" font-size="11" fill="#fbbf24">e.g. SWAP3</text>

  <!-- DUP / SWAP legends -->
  <text x="716" y="150" font-size="15" font-weight="700" fill="#c084fc">DUPn &#183; n = 1&#8230;16</text>
  <text x="716" y="168" font-size="12" fill="#94a3b8">copy the item at index n&#8722;1 onto the top</text>
  <text x="716" y="300" font-size="15" font-weight="700" fill="#fbbf24">SWAPn &#183; n = 1&#8230;16</text>
  <text x="716" y="318" font-size="12" fill="#94a3b8">swap the top with the item at index n</text>
  <text x="716" y="336" font-size="12" fill="#64748b">so SWAP16 pairs the top with index 16</text>

  <!-- reach bracket: DUP items 1..16, SWAP one deeper (item 17) -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="928" y1="120" x2="928" y2="400"/>
    <line x1="920" y1="120" x2="928" y2="120"/>
    <line x1="920" y1="400" x2="928" y2="400"/>
  </g>
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.8">
    <line x1="928" y1="400" x2="928" y2="428" stroke-dasharray="3 3"/>
    <line x1="920" y1="428" x2="928" y2="428"/>
  </g>
  <text x="912" y="432" text-anchor="end" font-size="11" fill="#fbbf24" opacity="0.8">16 &#183; SWAP16</text>
  <text transform="translate(950 274) rotate(90)" text-anchor="middle" font-size="12" fill="#94a3b8">reach &#183; DUP index &#8804; 15 &#183; SWAP index &#8804; 16</text>

  <!-- unreachable note -->
  <text x="716" y="456" font-size="12" fill="#64748b">deeper items are unreachable until</text>
  <text x="716" y="472" font-size="12" fill="#64748b">the stack shrinks above them</text>

  <!-- width indicator -->
  <line x1="382" y1="512" x2="598" y2="512" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
  <text x="490" y="532" text-anchor="middle" font-size="13" fill="#94a3b8">32 bytes &#183; one 256-bit word</text>

  <!-- bottom notes -->
  <text x="500" y="574" text-anchor="middle" font-size="13" fill="#e2e8f0">max depth 1024 &#8212; pushing past it is a stack overflow, popping an empty stack an underflow</text>
  <text x="500" y="598" text-anchor="middle" font-size="13" fill="#94a3b8">the stack is created with its call context and destroyed when the context ends</text>
</svg>
