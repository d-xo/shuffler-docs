<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Full Run of permute</title>
  <!-- Runs the shuffler's permute on a concrete example and lets you step
       through every swap. value v is "home" at position v; the swaps come from
       the cycle decomposition (0 2 4)(1 3)(5), and permute resolves one cycle
       at a time. Self-contained; shares the site theme and reports its height
       to the host iframe. -->
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    body { background: transparent; }
    .demo { padding: 20px 22px; }
    .phase { font-weight: 700; font-size: 15.5px; margin: 0 0 4px; min-height: 22px; }
    .phase.route { color: #58c4dd; }
    .phase.expose { color: #f7d96f; }
    .phase.done { color: #83c167; }
    .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 16px; }
    .sub .mono { color: var(--blue2); }

    .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
    .stagebox { flex: 0 0 250px; }
    .stagebox svg { width: 250px; max-width: 100%; height: auto; display: block; }
    .panel { flex: 1 1 240px; min-width: 210px; }

    .cyc h4, .trace h4 { margin: 0 0 8px; color: var(--mut); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-family: var(--mono); font-weight: 700; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip { font-family: var(--mono); font-size: 13px; padding: 3px 9px; border-radius: 7px; border: 1.5px solid; opacity: .5; }
    .chip.active { opacity: 1; font-weight: 700; }
    .chip.done { opacity: 1; }
    .chip .ok { font-size: 11px; }

    .trace .op { font-family: var(--mono); font-size: 13px; margin: 3px 0; color: var(--dim); }
    .trace .op.last { color: #9cdceb; }
    .trace .empty { color: var(--faint); font-size: 12px; font-style: italic; }

    .controls { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button { font: inherit; font-size: 14px; cursor: pointer; background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 7px 16px; }
    button:hover:not(:disabled) { border-color: var(--blue); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    .step { font-family: var(--mono); font-size: 12.5px; color: var(--dim); }

    .perm { margin: 20px 0 2px; }
    .perm .lab { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
    .perm .prow { display: flex; align-items: center; font-family: var(--mono); font-size: 14px; margin: 1px 0; }
    .perm .tag { width: 66px; color: var(--dim); font-size: 11px; }
    .perm .cell { width: 30px; text-align: center; padding: 2px 0; border-radius: 4px; transition: background .1s; }
    .perm .cell.hi { background: #2b2b2b; }
  </style>
</head>
<body>
  <div class="demo">
    <div class="phase route" id="phase"></div>
    <p class="sub">value <span class="mono">v</span> is home at position <span class="mono">v</span> &#183; permute emits swaps from the cycle decomposition <span class="mono">(0 2 4)(1 3)(5)</span>, resolving one cycle at a time</p>

    <div class="row">
      <div class="stagebox"><svg id="stage" viewBox="0 0 262 252" role="img" aria-label="permute state"></svg></div>
      <div class="panel">
        <div class="cyc">
          <h4>cycles</h4>
          <div class="chips" id="chips"></div>
        </div>
        <div class="trace">
          <h4>swap trace</h4>
          <div id="tracelist"></div>
        </div>
      </div>
    </div>

    <div class="perm">
      <div class="lab">current permutation</div>
      <div class="prow" id="permpos"></div>
      <div class="prow" id="permval"></div>
    </div>

    <div class="controls">
      <button id="back">&#9664; back</button>
      <button id="next">next &#9654;</button>
      <span class="step" id="step"></span>
    </div>
  </div>

  <script>
    var CYCLES = [[0, 2, 4], [1, 3], [5]];
    var CCOL = ["#58c4dd", "#f7d96f", "#83c167"];      // per-cycle color
    var cycleOf = [];
    CYCLES.forEach(function (cy, ci) { cy.forEach(function (p) { cycleOf[p] = ci; }); });

    var INITIAL = [2, 3, 4, 1, 0, 5];                   // value v -> home at position v
    var N = INITIAL.length;

    // Run permute, recording a frame per swap (state before it) plus a final frame.
    function genFrames() {
      var stack = INITIAL.slice(), trace = [], frames = [];
      function allHome() { return stack.every(function (v, i) { return v === i; }); }
      function resolved() { return CYCLES.map(function (cy) { return cy.every(function (p) { return stack[p] === p; }); }); }
      var guard = 0;
      while (!allHome() && guard++ < 100) {
        var top = N - 1, kind, j;
        if (stack[top] !== top) { kind = "route"; j = stack[top]; }
        else { kind = "expose"; for (var k = N - 1; k >= 0; k--) { if (stack[k] !== k) { j = k; break; } } }
        var depth = top - j, op = "swap" + depth;
        var moving = (kind === "route") ? stack[top] : stack[j];
        frames.push({
          stack: stack.slice(), pending: { top: top, partner: j, op: op, kind: kind },
          active: cycleOf[moving], resolved: resolved(), trace: trace.slice(),
          desc: (kind === "route")
            ? "top holds " + stack[top] + " — route it home to position " + j + "  ·  " + op
            : "top " + stack[top] + " is home — swap it into the cycle at position " + j + "  ·  " + op
        });
        var t = stack[top]; stack[top] = stack[j]; stack[j] = t; trace.push(op);
      }
      frames.push({ stack: stack.slice(), pending: null, active: -1, resolved: CYCLES.map(function () { return true; }), trace: trace.slice(), desc: "every slot is home — the stack is sorted" });
      return frames;
    }

    var frames = genFrames();
    var cur = 0;

    var BOXW = 96, BOXH = 30, ROW = 36, TOPY = 20, X = 48;
    function ytop(pos) { return TOPY + (N - 1 - pos) * ROW; }   // pos N-1 at top

    var stage = document.getElementById("stage");
    var phaseEl = document.getElementById("phase");
    var chipsEl = document.getElementById("chips");
    var traceEl = document.getElementById("tracelist");
    var stepEl = document.getElementById("step");
    var backBtn = document.getElementById("back");
    var nextBtn = document.getElementById("next");
    var permPos = document.getElementById("permpos");
    var permVal = document.getElementById("permval");

    function render() {
      var f = frames[cur];
      phaseEl.textContent = f.desc;
      phaseEl.className = "phase " + (f.pending ? f.pending.kind : "done");

      var p = f.pending;
      var s = "";
      // slots
      for (var pos = 0; pos < N; pos++) {
        var y = ytop(pos), val = f.stack[pos], hm = (val === pos);
        var col = CCOL[cycleOf[val]];
        var stroke = hm ? "#83c167" : col, sw = 1.4;
        if (p && pos === p.top) { stroke = "#58c4dd"; sw = 2.6; }
        else if (p && pos === p.partner) { stroke = "#f7d96f"; sw = 2.6; }
        var fill = hm ? "#14231a" : "#191919";
        var txt = hm ? "#83c167" : col;
        s += '<text x="40" y="' + (y + 20) + '" text-anchor="end" font-size="10" fill="#666666" class="mono">' + pos + "</text>";
        s += '<rect x="' + X + '" y="' + y + '" width="' + BOXW + '" height="' + BOXH + '" rx="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
        s += '<text x="' + (X + BOXW / 2) + '" y="' + (y + 20) + '" text-anchor="middle" font-size="14" fill="' + txt + '" class="mono">' + val + "</text>";
      }
      // top / bottom hints
      s += '<text x="' + (X + BOXW + 6) + '" y="' + (ytop(N - 1) + 12) + '" font-size="8.5" fill="#666666">top</text>';
      s += '<text x="' + (X + BOXW + 6) + '" y="' + (ytop(0) + 26) + '" font-size="8.5" fill="#666666">bottom</text>';
      // swap connector
      if (p) {
        var y1 = ytop(p.top) + BOXH / 2, y2 = ytop(p.partner) + BOXH / 2, mid = (y1 + y2) / 2;
        s += '<path d="M ' + (X + BOXW) + ' ' + y1 + ' Q ' + (X + BOXW + 62) + ' ' + mid + ' ' + (X + BOXW) + ' ' + y2 + '" fill="none" stroke="#f7d96f" stroke-width="1.5"/>';
        s += '<circle cx="' + (X + BOXW) + '" cy="' + y1 + '" r="3" fill="#58c4dd"/>';
        s += '<circle cx="' + (X + BOXW) + '" cy="' + y2 + '" r="3" fill="#f7d96f"/>';
        s += '<text x="' + (X + BOXW + 66) + '" y="' + (mid + 4) + '" font-size="12" fill="#f7d96f" class="mono">' + p.op + "</text>";
      }
      stage.innerHTML = s;

      // cycle chips
      chipsEl.innerHTML = CYCLES.map(function (cy, ci) {
        var cls = "chip", extra = "";
        if (f.resolved[ci]) { cls += " done"; extra = ' <span class="ok">&#10003;</span>'; }
        else if (ci === f.active) cls += " active";
        return '<span class="' + cls + '" style="border-color:' + CCOL[ci] + ';color:' + CCOL[ci] + '">(' + cy.join(" ") + ")" + extra + "</span>";
      }).join("");

      // trace
      if (!f.trace.length) traceEl.innerHTML = '<div class="empty">no swaps yet</div>';
      else traceEl.innerHTML = f.trace.map(function (op, i) {
        return '<div class="op' + (i === f.trace.length - 1 ? " last" : "") + '">' + op + "</div>";
      }).join("");

      // two-line notation of the current permutation (position -> value),
      // updating each step; the two swapping columns are highlighted.
      var pr = '<span class="tag">position</span>', vr = '<span class="tag">value</span>';
      for (var q = 0; q < N; q++) {
        var hv = p && (q === p.top || q === p.partner) ? " hi" : "";
        pr += '<span class="cell' + hv + '" style="color:#888888">' + q + "</span>";
        vr += '<span class="cell' + hv + '" style="color:' + CCOL[cycleOf[f.stack[q]]] + '">' + f.stack[q] + "</span>";
      }
      permPos.innerHTML = pr;
      permVal.innerHTML = vr;

      stepEl.textContent = (cur + 1) + " / " + frames.length;
      backBtn.disabled = cur === 0;
      nextBtn.disabled = cur === frames.length - 1;
    }

    backBtn.onclick = function () { if (cur > 0) { cur--; render(); } };
    nextBtn.onclick = function () { if (cur < frames.length - 1) { cur++; render(); } };
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") backBtn.onclick();
      else if (e.key === "ArrowRight") nextBtn.onclick();
    });
    var h = parseInt((location.hash || "").replace("#", ""), 10);
    if (!isNaN(h)) cur = Math.max(0, Math.min(frames.length - 1, h - 1));
    render();
  </script>
  <script src="../assets/viz-embed.js"></script>
</body>
</html>
