<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58c4dd"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f7d96f"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#83c167"/>
    </marker>
  </defs>

  <rect width="1000" height="680" rx="12" fill="#000000"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Cycle Decomposition</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#bbbbbb">follow each position until you return to where you started &#8212; every permutation splits into disjoint cycles</text>

  <!-- one row of positions with sigma arcs -->
  <text x="60" y="112" font-size="12" fill="#bbbbbb">the same permutation &#183; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">&#963; = [2 3 4 1 0 5]</tspan> &#183; one arrow per position</text>

  <!-- arcs above -->
  <path d="M 152 226 C 152 178, 332 178, 332 226" fill="none" stroke="#58c4dd" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 332 226 C 332 178, 512 178, 512 226" fill="none" stroke="#58c4dd" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 242 226 C 242 158, 422 158, 422 226" fill="none" stroke="#f7d96f" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <path d="M 590 226 C 578 190, 626 190, 614 226" fill="none" stroke="#83c167" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <!-- arcs below (the closing arrows) -->
  <path d="M 512 274 C 512 332, 152 332, 152 274" fill="none" stroke="#58c4dd" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 422 274 C 422 320, 242 320, 242 274" fill="none" stroke="#f7d96f" stroke-width="1.8" marker-end="url(#arrAmber)"/>

  <!-- position chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" text-anchor="middle">
    <rect x="120" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="152" y="256" fill="#9cdceb">0</text>
    <rect x="210" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="242" y="256" fill="#f7d96f">1</text>
    <rect x="300" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="332" y="256" fill="#9cdceb">2</text>
    <rect x="390" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="422" y="256" fill="#f7d96f">3</text>
    <rect x="480" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="512" y="256" fill="#9cdceb">4</text>
    <rect x="570" y="230" width="64" height="40" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="602" y="256" fill="#83c167">5</text>
  </g>

  <!-- the walk -->
  <text x="680" y="152" font-size="12.5" font-weight="700" fill="#ffffff">the walk</text>
  <text x="680" y="172" font-size="10.5" fill="#bbbbbb">start at the smallest unvisited position,</text>
  <text x="680" y="187" font-size="10.5" fill="#bbbbbb">follow &#963; until it returns &#183; repeat</text>

  <text x="680" y="220" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#9cdceb">0 &#8594; 2 &#8594; 4 &#8594; 0</text>
  <text x="680" y="236" font-size="10" fill="#888888">returns to its start &#8212; record (0 2 4)</text>
  <text x="680" y="266" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#f7d96f">1 &#8594; 3 &#8594; 1</text>
  <text x="680" y="282" font-size="10" fill="#888888">returns &#8212; record (1 3)</text>
  <text x="680" y="312" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#83c167">5 &#8594; 5</text>
  <text x="680" y="328" font-size="10" fill="#888888">already home &#8212; record (5)</text>

  <!-- untangled circles -->
  <line x1="60" y1="360" x2="940" y2="360" stroke="#222222" stroke-width="1"/>
  <text x="60" y="388" font-size="12.5" font-weight="700" fill="#ffffff">the same arrows, untangled &#8212; each chain closes into a circle</text>

  <!-- 3-cycle -->
  <g stroke="#58c4dd" stroke-width="1.8" fill="none">
    <path d="M 213 425 C 250 440, 262 462, 253 483" marker-end="url(#arrBlue)"/>
    <path d="M 230 505 C 214 517, 186 517, 170 505" marker-end="url(#arrBlue)"/>
    <path d="M 147 483 C 138 462, 150 440, 187 425" marker-end="url(#arrBlue)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <circle cx="200" cy="418" r="15" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="200" y="423" fill="#9cdceb">0</text>
    <circle cx="245" cy="496" r="15" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="245" y="501" fill="#9cdceb">2</text>
    <circle cx="155" cy="496" r="15" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="155" y="501" fill="#9cdceb">4</text>
  </g>

  <!-- 2-cycle -->
  <g stroke="#f7d96f" stroke-width="1.8" fill="none">
    <path d="M 462 442 C 478 456, 478 484, 462 498" marker-end="url(#arrAmber)"/>
    <path d="M 438 498 C 422 484, 422 456, 438 442" marker-end="url(#arrAmber)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <circle cx="450" cy="432" r="15" fill="#3a3416" stroke="#f7d96f" stroke-width="1.5"/>
    <text x="450" y="437" fill="#f7d96f">1</text>
    <circle cx="450" cy="508" r="15" fill="#3a3416" stroke="#f7d96f" stroke-width="1.5"/>
    <text x="450" y="513" fill="#f7d96f">3</text>
  </g>

  <!-- fixed point -->
  <path d="M 630 458 C 620 430, 660 430, 651 457" fill="none" stroke="#83c167" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <circle cx="640" cy="470" r="15" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
  <text x="640" y="475" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#83c167" text-anchor="middle">5</text>

  <g font-size="10.5" fill="#888888" text-anchor="middle">
    <text x="200" y="560">3-cycle &#183; <tspan fill="#9cdceb" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(0 2 4)</tspan></text>
    <text x="450" y="560">2-cycle &#183; <tspan fill="#f7d96f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(1 3)</tspan></text>
    <text x="640" y="560">fixed point &#183; <tspan fill="#83c167" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(5)</tspan></text>
  </g>

  <!-- cycle notation result -->
  <text x="756" y="420" font-size="12.5" font-weight="700" fill="#ffffff">the same &#963;, regrouped</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="752" y="497" font-size="56" fill="#444444">(</text>
    <text x="920" y="497" font-size="56" fill="#444444">)</text>
    <g font-size="12.5" text-anchor="middle" fill="#bbbbbb">
      <text x="790" y="464">0</text><text x="814" y="464">1</text><text x="838" y="464">2</text><text x="862" y="464">3</text><text x="886" y="464">4</text><text x="910" y="464">5</text>
    </g>
    <g font-size="12.5" text-anchor="middle">
      <text x="790" y="490" fill="#9cdceb">2</text><text x="814" y="490" fill="#f7d96f">3</text><text x="838" y="490" fill="#9cdceb">4</text><text x="862" y="490" fill="#f7d96f">1</text><text x="886" y="490" fill="#9cdceb">0</text><text x="910" y="490" fill="#83c167">5</text>
    </g>
  </g>
  <text x="756" y="516" font-size="9.5" fill="#888888">two-line notation &#183; bottom row coloured by cycle</text>
  <text x="756" y="544" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14.5" fill="#dddddd">&#963; = <tspan fill="#9cdceb">(0 2 4)</tspan><tspan fill="#f7d96f">(1 3)</tspan><tspan fill="#83c167">(5)</tspan></text>
  <text x="756" y="566" font-size="9.5" fill="#bbbbbb">disjoint &#183; unique up to rotation &amp; cycle order</text>

  <!-- footer -->
  <line x1="60" y1="590" x2="940" y2="590" stroke="#222222" stroke-width="1"/>
  <g font-size="11.5" fill="#bbbbbb">
    <text x="60" y="614">disjoint cycles share no positions, so each cycle can be resolved independently of the others</text>
    <text x="60" y="636">why the shuffler cares: a k-cycle resolves with k &#8722; 1 swaps, a fixed point with none &#8212; here 2 + 1 + 0 = 3 swaps, n &#8722; #cycles in general</text>
  </g>

  <text x="940" y="668" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">Shuffler.cpp &#183; Emission::permute</text>
</svg>
