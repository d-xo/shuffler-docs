<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1000" height="600" rx="12" fill="#0f172a"/>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">Haddon's <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">general_cycle_sort</tspan></text>
  <text x="500" y="63" text-anchor="middle" font-size="12.5" fill="#94a3b8">a histogram tells every element its home before any move &#8212; then each cycle is chased once, one write per element</text>

  <!-- ===== input + blocks ===== -->
  <text x="60" y="98" font-size="11.5" fill="#94a3b8">input &#183; keys drawn from {1, 2, 3} &#183; positions 1-indexed as in the paper</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" text-anchor="middle">
    <rect x="60" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="88" y="129" fill="#fbbf24">2</text>
    <rect x="124" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="152" y="129" fill="#4ade80">3</text>
    <rect x="188" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="216" y="129" fill="#7dd3fc">1</text>
    <rect x="252" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="280" y="129" fill="#7dd3fc">1</text>
    <rect x="316" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="344" y="129" fill="#4ade80">3</text>
    <rect x="380" y="106" width="56" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="408" y="129" fill="#fbbf24">2</text>
  </g>
  <g font-size="9" fill="#64748b" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="88" y="156">1</text><text x="152" y="156">2</text><text x="216" y="156">3</text>
    <text x="280" y="156">4</text><text x="344" y="156">5</text><text x="408" y="156">6</text>
  </g>
  <!-- target blocks -->
  <rect x="60" y="166" width="120" height="24" rx="4" fill="#16324a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="120" y="182" text-anchor="middle" font-size="9.5" fill="#7dd3fc">key 1 &#183; pos 1&#8211;2</text>
  <rect x="188" y="166" width="120" height="24" rx="4" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="248" y="182" text-anchor="middle" font-size="9.5" fill="#fbbf24">key 2 &#183; pos 3&#8211;4</text>
  <rect x="316" y="166" width="120" height="24" rx="4" fill="#12261c" stroke="#4ade80" stroke-width="1.2"/>
  <text x="376" y="182" text-anchor="middle" font-size="9.5" fill="#4ade80">key 3 &#183; pos 5&#8211;6</text>
  <text x="60" y="212" font-size="10.5" fill="#64748b">the cumulative histogram parcels the positions into one block per key</text>

  <!-- histogram math -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#cbd5e1">
    <text x="560" y="112">h&#160;&#160;&#160;= [2, 2, 2]</text>
    <text x="560" y="134">p+1 = [<tspan fill="#7dd3fc">1</tspan>, <tspan fill="#fbbf24">3</tspan>, <tspan fill="#4ade80">5</tspan>]&#160;&#160;block starts</text>
  </g>
  <g font-size="10.5" fill="#94a3b8">
    <text x="560" y="160">j = p[key] + 1 is the next free slot in the key's block;</text>
    <text x="560" y="176">p[key] advances as the block fills &#8212; duplicates each</text>
    <text x="560" y="192">get their own home, no comparisons ever made</text>
  </g>

  <!-- ===== the chases ===== -->
  <line x1="60" y1="232" x2="940" y2="232" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="258" font-size="12" fill="#e2e8f0">scan i = 1&#8230;n &#183; chase a cycle whenever the element at i belongs at j &#8804; i</text>
  <text x="60" y="276" font-size="10.5" fill="#64748b">i = 1, 2: their homes lie later in the scan (j &gt; i) &#8212; left in place for a cycle to collect</text>

  <!-- panel A: i = 3 -->
  <text x="70" y="304" font-size="11.5" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">i = 3</tspan> &#183; save := a[3] (key <tspan fill="#7dd3fc">1</tspan>) &#183; a 2-cycle</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="70" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="96" y="336" fill="#fbbf24">2</text>
    <rect x="130" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="156" y="336" fill="#4ade80">3</text>
    <rect x="190" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="216" y="336" fill="#7dd3fc">1</text>
    <rect x="250" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="276" y="336" fill="#7dd3fc">1</text>
    <rect x="310" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="336" y="336" fill="#4ade80">3</text>
    <rect x="370" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="396" y="336" fill="#fbbf24">2</text>
  </g>
  <!-- unmoved -->
  <g stroke="#334155" stroke-width="1">
    <line x1="156" y1="350" x2="156" y2="398"/>
    <line x1="276" y1="350" x2="276" y2="398"/>
    <line x1="336" y1="350" x2="336" y2="398"/>
    <line x1="396" y1="350" x2="396" y2="398"/>
  </g>
  <!-- moves -->
  <path d="M 216 350 C 216 376, 96 372, 96 398" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 96 350 C 96 376, 216 372, 216 398" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <circle cx="180" cy="362" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="180" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#7dd3fc">1</text>
  <circle cx="132" cy="386" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="132" y="390" text-anchor="middle" font-size="9" font-weight="700" fill="#fbbf24">2</text>
  <!-- after -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="70" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="96" y="424" fill="#7dd3fc">1</text>
    <rect x="130" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="156" y="424" fill="#4ade80">3</text>
    <rect x="190" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="216" y="424" fill="#fbbf24">2</text>
    <rect x="250" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="276" y="424" fill="#7dd3fc">1</text>
    <rect x="310" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="336" y="424" fill="#4ade80">3</text>
    <rect x="370" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="396" y="424" fill="#fbbf24">2</text>
  </g>
  <text x="70" y="458" font-size="10" fill="#64748b">key 1 goes home to pos 1 &#183; the displaced key 2 closes the cycle at pos 3</text>

  <!-- panel B: i = 4 -->
  <text x="540" y="304" font-size="11.5" fill="#94a3b8"><tspan font-weight="700" fill="#e2e8f0">i = 4</tspan> &#183; save := a[4] (key <tspan fill="#7dd3fc">1</tspan>) &#183; a 4-cycle</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="540" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="566" y="336" fill="#7dd3fc">1</text>
    <rect x="600" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="626" y="336" fill="#4ade80">3</text>
    <rect x="660" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="686" y="336" fill="#fbbf24">2</text>
    <rect x="720" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="746" y="336" fill="#7dd3fc">1</text>
    <rect x="780" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="806" y="336" fill="#4ade80">3</text>
    <rect x="840" y="314" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="866" y="336" fill="#fbbf24">2</text>
  </g>
  <!-- unmoved -->
  <g stroke="#334155" stroke-width="1">
    <line x1="566" y1="350" x2="566" y2="398"/>
    <line x1="686" y1="350" x2="686" y2="398"/>
  </g>
  <!-- moves: 4->2 (key1), 2->5 (key3), 5->6 (key3), 6->4 (key2) -->
  <path d="M 746 350 C 746 376, 626 372, 626 398" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 626 350 C 626 380, 806 368, 806 398" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <path d="M 806 350 C 806 372, 866 372, 866 398" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <path d="M 866 350 C 866 380, 746 372, 746 398" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <circle cx="710" cy="358" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="710" y="362" text-anchor="middle" font-size="9" font-weight="700" fill="#7dd3fc">1</text>
  <circle cx="700" cy="386" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
  <text x="700" y="390" text-anchor="middle" font-size="9" font-weight="700" fill="#4ade80">2</text>
  <circle cx="838" cy="362" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
  <text x="838" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#4ade80">3</text>
  <circle cx="812" cy="386" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="812" y="390" text-anchor="middle" font-size="9" font-weight="700" fill="#fbbf24">4</text>
  <!-- after -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="540" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="566" y="424" fill="#7dd3fc">1</text>
    <rect x="600" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="626" y="424" fill="#7dd3fc">1</text>
    <rect x="660" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="686" y="424" fill="#fbbf24">2</text>
    <rect x="720" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="746" y="424" fill="#fbbf24">2</text>
    <rect x="780" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="806" y="424" fill="#4ade80">3</text>
    <rect x="840" y="402" width="52" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="866" y="424" fill="#4ade80">3</text>
  </g>
  <text x="540" y="458" font-size="10" fill="#64748b">crosses three key blocks, closes at pos 4 &#8212; <tspan fill="#4ade80">sorted &#10003;</tspan> &#183; i = 5, 6 skip (j &gt; i)</text>

  <!-- ===== facts ===== -->
  <line x1="60" y1="480" x2="940" y2="480" stroke="#1e293b" stroke-width="1"/>
  <g font-size="11.5" fill="#94a3b8">
    <text x="60" y="506">each element is written into its final home exactly once; scan + chases touch each element at most twice &#8212; O(n + m), no comparisons</text>
    <text x="60" y="528">duplicate keys are what the histogram buys: any slot in a key's block is a valid home, and p[k] hands the block out in encounter order</text>
    <text x="60" y="550">the shuffler's <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">permute</tspan> is the same chase with the stack top as <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">save</tspan> &#8212; entering a cycle costs one extra swap, since the EVM's hand is itself a stack position</text>
  </g>

  <text x="940" y="582" text-anchor="end" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Haddon &#183; Cycle-Sort: A Linear Sorting Method &#183; The Computer Journal 33(4), 1990</text>
</svg>
