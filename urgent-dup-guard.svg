<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="360" rx="12" fill="#0f172a"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5f9">The Urgent Dup &#183; The One Guard</text>
  <text x="320" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">the rescue pushes one slot, sinking everything &#8212; the offset j being filled must stay within swap reach (drawn as 3)</text>

  <line x1="330" y1="90" x2="330" y2="322" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== left panel: allowed ===== -->
  <g font-size="8.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="74" y="137">0</text>
    <text x="74" y="167">1</text>
    <text x="74" y="197">2</text>
    <text x="74" y="227">3</text>
    <text x="74" y="257">4</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="80" y="120" width="72" height="26" rx="4" fill="#12261c" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="116" y="137.5" fill="#4ade80">b</text>
    <rect x="80" y="150" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="116" y="167.5" fill="#cbd5e1">w</text>
    <rect x="80" y="180" width="72" height="26" rx="4" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="116" y="197.5" fill="#fbbf24">v</text>
    <rect x="80" y="210" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="116" y="227.5" fill="#cbd5e1">u</text>
    <rect x="80" y="240" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="116" y="257.5" fill="#cbd5e1">t</text>
  </g>
  <text x="160" y="137" font-size="10" fill="#4ade80">&#9666; the dup would land here</text>
  <text x="160" y="197" font-size="10" fill="#fbbf24">&#9666; j &#183; being filled</text>
  <line x1="70" y1="239" x2="300" y2="239" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="300" y="235" text-anchor="end" font-size="9" fill="#fbbf24">swap reach</text>

  <g font-size="10.5" text-anchor="middle">
    <text x="185" y="300" fill="#4ade80">&#10003; after the dup, j sits at depth 2 &#8212; headroom for</text>
    <text x="185" y="316" fill="#94a3b8">one more push (generating j's own slot): dup now</text>
  </g>

  <!-- ===== right panel: skipped ===== -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="380" y="120" width="72" height="26" rx="4" fill="#12261c" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="416" y="137.5" fill="#4ade80">b</text>
    <rect x="380" y="150" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="416" y="167.5" fill="#cbd5e1">w</text>
    <rect x="380" y="180" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="416" y="197.5" fill="#cbd5e1">u</text>
    <rect x="380" y="210" width="72" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
    <text x="416" y="227.5" fill="#cbd5e1">t</text>
    <rect x="380" y="240" width="72" height="26" rx="4" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="416" y="257.5" fill="#fbbf24">v</text>
  </g>
  <text x="460" y="137" font-size="10" fill="#4ade80">&#9666; the dup would land here</text>
  <text x="460" y="257" font-size="10" fill="#fbbf24">&#9666; j &#183; being filled</text>
  <line x1="370" y1="239" x2="600" y2="239" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="600" y="235" text-anchor="end" font-size="9" fill="#fbbf24">swap reach</text>

  <g font-size="10.5" text-anchor="middle">
    <text x="485" y="300" fill="#f87171">&#10007; j is at the swap limit already &#8212; the dup pushes it</text>
    <text x="485" y="316" fill="#94a3b8">out of reach for good (nothing pops here): skip</text>
  </g>

  <text x="600" y="344" text-anchor="end" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Shuffler.cpp &#183; Emission::buildBottomUp &#183; urgent dup</text>
</svg>
