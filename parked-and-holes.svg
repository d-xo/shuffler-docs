<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrSlate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1000" height="700" rx="12" fill="#0f172a"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Parked Slots &amp; Holes</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#94a3b8">why parked-not-in-a-hole = free holes &#183; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">permuteAtLowestHeight</tspan></text>

  <!-- ===== left: the stack ===== -->
  <text x="60" y="106" font-size="12.5" font-weight="700" fill="#e2e8f0">the stack at its lowest height &#183; h = 6, target height 9</text>

  <!-- ghost offsets above the height -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">
    <rect x="100" y="118" width="120" height="24" rx="4" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="92" y="134" text-anchor="end">8</text>
    <rect x="100" y="146" width="120" height="24" rx="4" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="92" y="162" text-anchor="end">7</text>
    <rect x="100" y="174" width="120" height="24" rx="4" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="92" y="190" text-anchor="end">6</text>
  </g>
  <text x="310" y="162" font-size="10" fill="#64748b">doesn't exist yet &#8212; parked</text>
  <text x="310" y="176" font-size="10" fill="#64748b">destinations point up here</text>

  <!-- parked destination curves -->
  <path d="M 224 276 C 252 268, 252 138, 224 130" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <path d="M 224 322 C 282 306, 282 174, 224 158" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>

  <!-- real rows: fill = slot kind, stroke = position kind -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" text-anchor="middle">
    <rect x="100" y="210" width="120" height="40" rx="5" fill="#16324a" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="235" fill="#7dd3fc">&#8594; 5</text>
    <rect x="100" y="256" width="120" height="40" rx="5" fill="#3a2d10" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="160" y="281" fill="#fbbf24">&#8594; 8</text>
    <rect x="100" y="302" width="120" height="40" rx="5" fill="#3a2d10" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="327" fill="#fbbf24">&#8594; 7</text>
    <rect x="100" y="348" width="120" height="40" rx="5" fill="#16324a" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="160" y="373" fill="#7dd3fc">&#8594; 1</text>
    <rect x="100" y="394" width="120" height="40" rx="5" fill="#16324a" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="419" fill="#7dd3fc">&#8594; 3</text>
    <rect x="100" y="440" width="120" height="40" rx="5" fill="#16324a" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="465" fill="#7dd3fc">&#8594; 0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#64748b" text-anchor="end">
    <text x="92" y="234">5</text>
    <text x="92" y="280">4</text>
    <text x="92" y="326">3</text>
    <text x="92" y="372">2</text>
    <text x="92" y="418">1</text>
    <text x="92" y="464">0</text>
  </g>

  <!-- pos3 moves into hole 2 -->
  <path d="M 96 322 C 72 330, 72 360, 96 368" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrAmber)"/>

  <!-- row annotations -->
  <g font-size="10.5" fill="#94a3b8">
    <text x="310" y="234">placeable &#183; already final</text>
    <text x="310" y="272">parked, standing in a hole</text>
    <text x="310" y="286" fill="#64748b">&#8594; stays put</text>
    <text x="310" y="318">parked, in the way</text>
    <text x="310" y="332" fill="#64748b">&#8594; takes free hole 2</text>
    <text x="310" y="364">placeable, standing in a hole</text>
    <text x="310" y="378" fill="#64748b">&#8594; leaves for 1 &#183; hole freed</text>
    <text x="310" y="418">placeable &#8594; 3</text>
    <text x="310" y="464">placeable &#183; already final</text>
  </g>

  <!-- legend -->
  <g font-size="10.5" fill="#94a3b8">
    <rect x="60" y="508" width="12" height="12" rx="3" fill="#16324a" stroke="#38bdf8" stroke-width="1"/>
    <text x="78" y="518">placeable (dest &lt; h)</text>
    <rect x="200" y="508" width="12" height="12" rx="3" fill="#3a2d10" stroke="#fbbf24" stroke-width="1"/>
    <text x="218" y="518">parked (dest &#8805; h)</text>
    <rect x="336" y="508" width="12" height="12" rx="3" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="354" y="518">hole &#183; slot generated later</text>
  </g>

  <!-- ===== right: counting ===== -->
  <text x="500" y="106" font-size="12.5" font-weight="700" fill="#e2e8f0">count the same h units twice</text>

  <!-- bar A: slots by destination -->
  <text x="500" y="134" font-size="11" fill="#94a3b8">the h slots &#183; classified by destination</text>
  <rect x="500" y="142" width="256" height="34" rx="4" fill="#16324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="628" y="163" text-anchor="middle" font-size="11.5" fill="#7dd3fc">placeable &#183; 4</text>
  <rect x="756" y="142" width="128" height="34" rx="4" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="820" y="163" text-anchor="middle" font-size="11.5" fill="#fbbf24">parked &#183; 2</text>

  <!-- bijection arrows -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="532" y1="184" x2="532" y2="224" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
    <line x1="596" y1="184" x2="596" y2="224" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
    <line x1="660" y1="184" x2="660" y2="224" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
    <line x1="724" y1="184" x2="724" y2="224" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
  </g>
  <line x1="820" y1="184" x2="820" y2="224" stroke="#4ade80" stroke-width="1.5" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="832" y="208" font-size="10" fill="#4ade80">&#8756; equal</text>

  <!-- bar B: positions by planned mapping -->
  <rect x="500" y="232" width="256" height="34" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="628" y="253" text-anchor="middle" font-size="11.5" fill="#cbd5e1">non-hole &#183; 4</text>
  <rect x="756" y="232" width="128" height="34" rx="4" fill="#12261c" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="820" y="253" text-anchor="middle" font-size="11.5" fill="#4ade80">holes &#183; 2</text>
  <text x="500" y="288" font-size="11" fill="#94a3b8">the h positions &#183; classified by the planned mapping</text>

  <text x="500" y="316" font-size="11" fill="#94a3b8">every non-hole is the destination of exactly one placeable slot (&#8645;),</text>
  <text x="500" y="332" font-size="11" fill="#94a3b8">and both bars are the same h units &#8212; so the leftovers must be equal too.</text>

  <!-- step 3: cancel the overlap -->
  <text x="500" y="366" font-size="11" fill="#94a3b8">a parked slot standing in a hole plugs one unit on each side &#8212; cancel it:</text>
  <rect x="500" y="376" width="128" height="30" rx="4" fill="#3a2d10" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="564" y="395" text-anchor="middle" font-size="10.5" fill="#fbbf24">in a hole &#183; 1</text>
  <rect x="628" y="376" width="128" height="30" rx="4" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="692" y="395" text-anchor="middle" font-size="10.5" fill="#fbbf24">in the way &#183; 1</text>

  <line x1="564" y1="412" x2="564" y2="444" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="556" y="432" text-anchor="end" font-size="9.5" fill="#64748b">same pair &#183; cancels</text>
  <line x1="692" y1="412" x2="692" y2="444" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrSlate)" marker-end="url(#arrSlate)"/>
  <text x="700" y="432" font-size="9.5" fill="#94a3b8">left over &#8212; matched 1 : 1</text>

  <rect x="500" y="448" width="128" height="30" rx="4" fill="#12261c" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="564" y="467" text-anchor="middle" font-size="10.5" fill="#4ade80">plugged &#183; 1</text>
  <rect x="628" y="448" width="128" height="30" rx="4" fill="#12261c" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="692" y="467" text-anchor="middle" font-size="10.5" fill="#4ade80">free &#183; 1</text>

  <!-- conclusion -->
  <rect x="500" y="502" width="440" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#e2e8f0" text-anchor="middle">
    <text x="720" y="527">placeable = non-holes &#8658; parked = holes</text>
    <text x="720" y="547">&#8658; parked &#8726; plugged = free holes</text>
  </g>

  <!-- footer notes -->
  <line x1="60" y1="590" x2="940" y2="590" stroke="#1e293b" stroke-width="1"/>
  <g font-size="11.5" fill="#94a3b8">
    <text x="60" y="614">the code matches the two leftover sets in ascending order &#8212; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">yulAssert(parked.size() == holes.size())</tspan></text>
    <text x="60" y="636">each free hole later receives its generated slot; the swap that fills it floats the parked slot to the top for free</text>
  </g>

  <text x="940" y="684" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Shuffler.cpp &#183; Emission::permuteAtLowestHeight</text>
</svg>
