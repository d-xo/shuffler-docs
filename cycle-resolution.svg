<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="rA" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/>
    </marker>
    <marker id="rS" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="640" rx="12" fill="#0f172a"/>

  <!-- title -->
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">Resolving a Cycle, Step by Step</text>
  <text x="500" y="66" text-anchor="middle" font-size="12.5" fill="#94a3b8">repeat: swap the top with its slot's destination &#183; four slots, dest = [2 3 1 0] &#8212; one 4-cycle through the top</text>

  <!-- row labels -->
  <g font-size="10" fill="#475569">
    <text x="18" y="212">stack</text>
    <text x="18" y="360">two-line</text>
    <text x="18" y="414">cycles</text>
  </g>

  <!-- captions -->
  <g font-size="10.5" fill="#94a3b8" text-anchor="middle">
    <text x="150" y="122">start</text>
    <text x="385" y="122">after SWAP3</text>
    <text x="620" y="122">after SWAP1</text>
    <text x="855" y="122">after SWAP2 &#183; sorted</text>
  </g>

  <!-- ======= column 1: start ======= -->
  <g font-size="9.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="87" y="161">3&#183;top</text><text x="87" y="201">2</text><text x="87" y="241">1</text><text x="87" y="281">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="95" y="140" width="110" height="34" rx="5" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="150" y="162" fill="#fbbf24">d &#8594; 0</text>
    <rect x="95" y="180" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="202" fill="#cbd5e1">c &#8594; 1</text>
    <rect x="95" y="220" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="242" fill="#cbd5e1">b &#8594; 3</text>
    <rect x="92" y="257" width="116" height="40" rx="7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="95" y="260" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="282" fill="#cbd5e1">a &#8594; 2</text>
  </g>
  <path d="M 207 157 C 232 177, 232 257, 210 277" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#rA)"/>
  <!-- two-line -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="96" y="372" font-size="40" fill="#475569">(</text>
    <text x="190" y="372" font-size="40" fill="#475569">)</text>
    <g font-size="11.5" text-anchor="middle" fill="#94a3b8">
      <text x="120" y="346">0</text><text x="140" y="346">1</text><text x="160" y="346">2</text><text x="180" y="346">3</text>
    </g>
    <g font-size="11.5" text-anchor="middle" fill="#fbbf24">
      <text x="120" y="368">2</text><text x="140" y="368">3</text><text x="160" y="368">1</text><text x="180" y="368">0</text>
    </g>
  </g>
  <text x="150" y="408" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#fbbf24">(0 2 1 3)</text>
  <text x="150" y="428" text-anchor="middle" font-size="10" fill="#64748b">fixed: none</text>

  <!-- swap 1 -->
  <text x="267" y="192" text-anchor="middle" font-size="10" fill="#e2e8f0">SWAP3</text>
  <line x1="235" y1="205" x2="299" y2="205" stroke="#64748b" stroke-width="1.4" marker-end="url(#rS)"/>
  <text x="267" y="316" text-anchor="middle" font-size="9" fill="#4ade80">d lands home at 0</text>
  <text x="267" y="330" text-anchor="middle" font-size="9" fill="#94a3b8">a is lifted to the top</text>

  <!-- ======= column 2 ======= -->
  <g font-size="9.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="322" y="161">3&#183;top</text><text x="322" y="201">2</text><text x="322" y="241">1</text><text x="322" y="281">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="330" y="140" width="110" height="34" rx="5" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="385" y="162" fill="#fbbf24">a &#8594; 2</text>
    <rect x="327" y="177" width="116" height="40" rx="7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="330" y="180" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="202" fill="#cbd5e1">c &#8594; 1</text>
    <rect x="330" y="220" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="242" fill="#cbd5e1">b &#8594; 3</text>
    <rect x="330" y="260" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="385" y="282" fill="#4ade80">d &#8594; 0 &#10003;</text>
  </g>
  <path d="M 442 157 C 464 165, 464 189, 445 197" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#rA)"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="331" y="372" font-size="40" fill="#475569">(</text>
    <text x="425" y="372" font-size="40" fill="#475569">)</text>
    <g font-size="11.5" text-anchor="middle" fill="#94a3b8">
      <text x="355" y="346">0</text><text x="375" y="346">1</text><text x="395" y="346">2</text><text x="415" y="346">3</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="355" y="368" fill="#4ade80">0</text><text x="375" y="368" fill="#fbbf24">3</text><text x="395" y="368" fill="#fbbf24">1</text><text x="415" y="368" fill="#fbbf24">2</text>
    </g>
  </g>
  <text x="385" y="408" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#fbbf24">(1 3 2)</text>
  <text x="385" y="428" text-anchor="middle" font-size="10" fill="#4ade80">fixed: 0</text>

  <!-- swap 2 -->
  <text x="502" y="192" text-anchor="middle" font-size="10" fill="#e2e8f0">SWAP1</text>
  <line x1="470" y1="205" x2="534" y2="205" stroke="#64748b" stroke-width="1.4" marker-end="url(#rS)"/>
  <text x="502" y="316" text-anchor="middle" font-size="9" fill="#4ade80">a lands home at 2</text>
  <text x="502" y="330" text-anchor="middle" font-size="9" fill="#94a3b8">c is lifted to the top</text>

  <!-- ======= column 3 ======= -->
  <g font-size="9.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="557" y="161">3&#183;top</text><text x="557" y="201">2</text><text x="557" y="241">1</text><text x="557" y="281">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="565" y="140" width="110" height="34" rx="5" fill="#3a2d10" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="620" y="162" fill="#fbbf24">c &#8594; 1</text>
    <rect x="565" y="180" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="620" y="202" fill="#4ade80">a &#8594; 2 &#10003;</text>
    <rect x="562" y="217" width="116" height="40" rx="7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="565" y="220" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="620" y="242" fill="#cbd5e1">b &#8594; 3</text>
    <rect x="565" y="260" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="620" y="282" fill="#4ade80">d &#8594; 0 &#10003;</text>
  </g>
  <path d="M 677 157 C 699 172, 699 222, 680 237" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#rA)"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="566" y="372" font-size="40" fill="#475569">(</text>
    <text x="660" y="372" font-size="40" fill="#475569">)</text>
    <g font-size="11.5" text-anchor="middle" fill="#94a3b8">
      <text x="590" y="346">0</text><text x="610" y="346">1</text><text x="630" y="346">2</text><text x="650" y="346">3</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="590" y="368" fill="#4ade80">0</text><text x="610" y="368" fill="#fbbf24">3</text><text x="630" y="368" fill="#4ade80">2</text><text x="650" y="368" fill="#fbbf24">1</text>
    </g>
  </g>
  <text x="620" y="408" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#fbbf24">(1 3)</text>
  <text x="620" y="428" text-anchor="middle" font-size="10" fill="#4ade80">fixed: 0 2</text>

  <!-- swap 3 -->
  <text x="737" y="192" text-anchor="middle" font-size="10" fill="#e2e8f0">SWAP2</text>
  <line x1="705" y1="205" x2="769" y2="205" stroke="#64748b" stroke-width="1.4" marker-end="url(#rS)"/>
  <text x="737" y="316" text-anchor="middle" font-size="9" fill="#4ade80">c lands home at 1 &#8212;</text>
  <text x="737" y="330" text-anchor="middle" font-size="9" fill="#4ade80">and b lands home too</text>

  <!-- ======= column 4: sorted ======= -->
  <g font-size="9.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="792" y="161">3&#183;top</text><text x="792" y="201">2</text><text x="792" y="241">1</text><text x="792" y="281">0</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="800" y="140" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.8"/>
    <text x="855" y="162" fill="#4ade80">b &#8594; 3 &#10003;</text>
    <rect x="800" y="180" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="855" y="202" fill="#4ade80">a &#8594; 2 &#10003;</text>
    <rect x="800" y="220" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="855" y="242" fill="#4ade80">c &#8594; 1 &#10003;</text>
    <rect x="800" y="260" width="110" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
    <text x="855" y="282" fill="#4ade80">d &#8594; 0 &#10003;</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="801" y="372" font-size="40" fill="#475569">(</text>
    <text x="895" y="372" font-size="40" fill="#475569">)</text>
    <g font-size="11.5" text-anchor="middle" fill="#94a3b8">
      <text x="825" y="346">0</text><text x="845" y="346">1</text><text x="865" y="346">2</text><text x="885" y="346">3</text>
    </g>
    <g font-size="11.5" text-anchor="middle" fill="#4ade80">
      <text x="825" y="368">0</text><text x="845" y="368">1</text><text x="865" y="368">2</text><text x="885" y="368">3</text>
    </g>
  </g>
  <text x="855" y="408" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#4ade80">identity</text>
  <text x="855" y="428" text-anchor="middle" font-size="10" fill="#4ade80">fixed: 0 1 2 3</text>

  <!-- ===== why ===== -->
  <line x1="60" y1="458" x2="940" y2="458" stroke="#1e293b" stroke-width="1"/>
  <g font-size="11.5" fill="#94a3b8">
    <circle cx="66" cy="482" r="4" fill="#fbbf24"/>
    <text x="80" y="486">the dashed box marks the top slot's destination &#8212; that is always the next swap: it sends the top's slot home and lifts the slot that lived there</text>
    <circle cx="66" cy="508" r="4" fill="#4ade80"/>
    <text x="80" y="512">green slots are finished forever &#8212; each position is the destination of exactly one slot, so once that slot arrives, no later swap targets the position</text>
    <circle cx="66" cy="534" r="4" fill="#38bdf8"/>
    <text x="80" y="538">the cycle in the notation loses one element per swap; the last swap fixes <tspan fill="#e2e8f0">two</tspan> entries at once, because the lifted slot's destination is the top itself</text>
  </g>

  <text x="60" y="572" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#64748b">&#963; = (0 2 1 3) = (3 1)(3 2)(3 0) &#8212; read right to left: the swap sequence is a factorization of the cycle, k elements in k &#8722; 1 swaps</text>

  <text x="940" y="614" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Shuffler.cpp &#183; Emission::permute &#183; exchangeWithTop</text>
</svg>
