<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#58c4dd"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#9a72ac"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#f7d96f"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#fc6255"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#83c167"/>
    </marker>
  </defs>

  <rect width="1000" height="700" rx="12" fill="#000000"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">The Mapping Phase</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#bbbbbb">a partial bijection between source slots and target offsets &#8212; no destination is served twice</text>

  <!-- column headers -->
  <text x="290" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">source</text>
  <text x="710" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">target</text>
  <text x="500" y="140" text-anchor="middle" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#888888">destinationOf &#8594; &#160;&#183;&#160; &#8592; positionOf</text>

  <!-- source column (top = offset 4) -->
  <g>
    <rect x="200" y="150" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="200" y="206" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="200" y="262" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="200" y="318" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="200" y="374" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" text-anchor="middle">
    <text x="290" y="180" fill="#fc6255">x</text>
    <text x="290" y="236" fill="#f7d96f">b</text>
    <text x="290" y="292" fill="#5cd0b3">c</text>
    <text x="290" y="348" fill="#f7d96f">b</text>
    <text x="290" y="404" fill="#9cdceb">a</text>
  </g>
  <g font-size="10" fill="#888888" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="212" y="166">4</text>
    <text x="212" y="222">3</text>
    <text x="212" y="278">2</text>
    <text x="212" y="334">1</text>
    <text x="212" y="390">0</text>
  </g>

  <!-- target column -->
  <g>
    <rect x="620" y="150" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="620" y="206" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="620" y="262" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <rect x="620" y="318" width="180" height="48" rx="6" fill="#0d0d0d" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="620" y="374" width="180" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" text-anchor="middle">
    <text x="710" y="180" fill="#f7d96f">b</text>
    <text x="710" y="236" fill="#5cd0b3">c</text>
    <text x="710" y="292" fill="#f7d96f">b</text>
    <text x="710" y="348" fill="#bbbbbb" font-style="italic" font-size="14">junk</text>
    <text x="710" y="404" fill="#9cdceb">a</text>
  </g>
  <g font-size="10" fill="#888888" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="632" y="166">4</text>
    <text x="632" y="222">3</text>
    <text x="632" y="278">2</text>
    <text x="632" y="334">1</text>
    <text x="632" y="390">0</text>
  </g>

  <!-- top/bottom markers -->
  <text x="808" y="166" font-size="10.5" fill="#888888">top</text>
  <text x="808" y="404" font-size="10.5" fill="#888888">bottom</text>

  <!-- base lines -->
  <line x1="200" y1="428" x2="380" y2="428" stroke="#444444" stroke-width="3" stroke-linecap="round"/>
  <line x1="620" y1="428" x2="800" y2="428" stroke="#444444" stroke-width="3" stroke-linecap="round"/>

  <!-- mapping arrows -->
  <!-- pass 1: 0 -> 0, already in place -->
  <line x1="384" y1="398" x2="612" y2="398" stroke="#58c4dd" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- pass 2: 3 -> 2 and 2 -> 3, closest copies -->
  <line x1="384" y1="230" x2="612" y2="286" stroke="#58c4dd" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="384" y1="286" x2="612" y2="230" stroke="#58c4dd" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- pass 4: wildcard keeps its occupant, 1 -> 1 -->
  <line x1="384" y1="342" x2="612" y2="342" stroke="#9a72ac" stroke-width="2" marker-end="url(#arrViolet)"/>
  <!-- pass 3 alternative: under Take, the b in the wildcard slot is bound for target 4 -->
  <path d="M 384 330 C 470 292, 500 200, 608 182" fill="none" stroke="#f7d96f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>

  <!-- pass tags -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <circle cx="498" cy="398" r="9" fill="#000000" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="498" y="402" fill="#58c4dd">1</text>
    <circle cx="460" cy="267" r="9" fill="#000000" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="460" y="271" fill="#58c4dd">2</text>
    <circle cx="540" cy="268" r="9" fill="#000000" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="540" y="272" fill="#58c4dd">2</text>
    <circle cx="498" cy="342" r="9" fill="#000000" stroke="#9a72ac" stroke-width="1.5"/>
    <text x="498" y="346" fill="#9a72ac">4</text>
    <circle cx="551" cy="200" r="9" fill="#000000" stroke="#f7d96f" stroke-width="1.5"/>
    <text x="551" y="204" fill="#f7d96f">3</text>
  </g>
  <text x="566" y="207" font-size="10.5" fill="#c78d46">under Take</text>

  <!-- surplus: x has no destination, popped -->
  <line x1="196" y1="178" x2="124" y2="178" stroke="#fc6255" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="158" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#fc6255">surplus</text>
  <text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#bbbbbb">popped</text>

  <!-- generated: target 4 has no source, produced during realisation -->
  <line x1="880" y1="188" x2="804" y2="188" stroke="#83c167" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="842" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#83c167">generated</text>
  <text x="848" y="228" text-anchor="middle" font-size="10.5" fill="#bbbbbb">here: DUP of a retained b</text>

  <!-- how it is built -->
  <line x1="60" y1="470" x2="940" y2="470" stroke="#222222" stroke-width="1"/>
  <text x="70" y="500" font-size="14" font-weight="700" fill="#ffffff">how the mapping is built</text>
  <text x="930" y="500" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">Shuffler.cpp &#183; MappingBuilder</text>

  <g font-size="11.5" fill="#bbbbbb">
    <circle cx="78" cy="526" r="9" fill="none" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="78" y="530" text-anchor="middle" font-size="10.5" font-weight="700" fill="#58c4dd">1</text>
    <text x="96" y="530">equal slots already in place map directly &#8212; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">source[j] == target[j]</tspan></text>

    <circle cx="78" cy="552" r="9" fill="none" stroke="#58c4dd" stroke-width="1.5"/>
    <text x="78" y="556" text-anchor="middle" font-size="10.5" font-weight="700" fill="#58c4dd">2</text>
    <text x="96" y="556">each unserved target takes the closest remaining copy outside wildcard slots &#183; ties go to the shallower one</text>

    <circle cx="78" cy="578" r="9" fill="none" stroke="#f7d96f" stroke-width="1.5"/>
    <text x="78" y="582" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f7d96f">3</text>
    <text x="96" y="582">copies standing in wildcard slots are left where they are or taken (dashed) &#183; both plans are tried, the cheaper wins &#183; return labels are always taken</text>

    <circle cx="78" cy="604" r="9" fill="none" stroke="#9a72ac" stroke-width="1.5"/>
    <text x="78" y="608" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a72ac">4</text>
    <text x="96" y="608">wildcard targets keep whatever occupies their offset</text>

    <circle cx="78" cy="630" r="9" fill="none" stroke="#888888" stroke-width="1.5"/>
    <text x="78" y="634" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bbbbbb">5</text>
    <text x="96" y="634">remaining wildcard targets absorb the closest surplus, saving a pop (here: under Take, <tspan fill="#fc6255" font-family="ui-monospace, 'SF Mono', Menlo, monospace">x</tspan> parks in the freed junk slot)</text>

    <text x="96" y="664">leftovers: unserved targets are <tspan fill="#83c167" font-weight="700">generated</tspan> (pushed / duped / loaded) &#183; unmapped source slots are <tspan fill="#fc6255" font-weight="700">surplus</tspan> (popped)</text>
  </g>

  <text x="940" y="688" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">libyul/backends/evm/ssa/stack/Shuffler.cpp</text>
</svg>
