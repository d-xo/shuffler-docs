<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="dmA" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f7d96f"/>
    </marker>
    <marker id="dmS" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
    <marker id="dmG" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#83c167"/>
    </marker>
    <marker id="dmB" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58c4dd"/>
    </marker>
  </defs>

  <rect width="1000" height="650" rx="12" fill="#000000"/>

  <!-- title -->
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Equal Slots Don&#8217;t Chase Each Other</text>
  <text x="500" y="66" text-anchor="middle" font-size="12.5" fill="#bbbbbb">&#963; = (0&#8594;3 &#183; 1&#8594;0 &#183; 2&#8594;1 &#183; 3&#8594;2 &#183; 4&#8594;4) over [v v a v b] &#8212; the rewrite picks cheaper representatives among equal slots: 5 exchanges become 3</text>

  <!-- row labels -->
  <g font-size="10" fill="#444444">
    <text x="18" y="180">input</text>
    <text x="18" y="402">rewritten</text>
  </g>

  <!-- ======= row 1: input permutation ======= -->
  <!-- arrows -->
  <path d="M 220 154 C 300 98, 560 98, 640 154" fill="none" stroke="#f7d96f" stroke-width="1.5" marker-end="url(#dmA)"/>
  <path d="M 360 154 C 325 122, 255 122, 220 154" fill="none" stroke="#f7d96f" stroke-width="1.5" marker-end="url(#dmA)"/>
  <path d="M 640 154 C 605 122, 535 122, 500 154" fill="none" stroke="#f7d96f" stroke-width="1.5" marker-end="url(#dmA)"/>
  <path d="M 500 154 C 465 122, 395 122, 360 154" fill="none" stroke="#888888" stroke-width="1.4" marker-end="url(#dmS)"/>

  <!-- chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="170" y="158" width="100" height="36" rx="5" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="220" y="181" fill="#f7d96f">v &#8594; 3</text>
    <rect x="310" y="158" width="100" height="36" rx="5" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="360" y="181" fill="#f7d96f">v &#8594; 0</text>
    <rect x="450" y="158" width="100" height="36" rx="5" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="500" y="181" fill="#dddddd">a &#8594; 1</text>
    <rect x="590" y="158" width="100" height="36" rx="5" fill="#3a3416" stroke="#f7d96f" stroke-width="1.8"/>
    <text x="640" y="181" fill="#f7d96f">v &#8594; 2</text>
    <rect x="730" y="158" width="100" height="36" rx="5" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="780" y="181" fill="#83c167">b &#8594; 4 &#10003;</text>
  </g>

  <!-- offsets -->
  <g font-size="9.5" fill="#888888" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="220" y="214">0&#183;bottom</text>
    <text x="360" y="214">1</text>
    <text x="500" y="214">2</text>
    <text x="640" y="214">3</text>
    <text x="780" y="214">4&#183;top</text>
  </g>

  <text x="500" y="242" text-anchor="middle" font-size="11">
    <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#f7d96f">(0 3 2 1)</tspan>
    <tspan fill="#bbbbbb"> &#8212; one 4-cycle threading all three v&#8217;s &#183; 5 exchanges to resolve &#183; twice a v dislodges another v</tspan>
  </text>

  <!-- ======= the rewrite, in sets ======= -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle">
    <text x="500" y="288" fill="#bbbbbb">group = <tspan fill="#f7d96f">{0 1 3}</tspan>   desired = &#963;(group) = <tspan fill="#f7d96f">{3 0 2}</tspan></text>
    <text x="500" y="308" fill="#bbbbbb">stayers = group &#8745; desired = <tspan fill="#83c167">{0 3}</tspan>   movers = group &#8726; desired = <tspan fill="#58c4dd">{1}</tspan>   vacant = desired &#8726; group = <tspan fill="#58c4dd">{2}</tspan></text>
  </g>

  <!-- ======= row 2: rewritten permutation ======= -->
  <!-- stayer self-loops -->
  <path d="M 202 376 C 188 350, 252 350, 238 376" fill="none" stroke="#83c167" stroke-width="1.4" marker-end="url(#dmG)"/>
  <path d="M 622 376 C 608 350, 672 350, 658 376" fill="none" stroke="#83c167" stroke-width="1.4" marker-end="url(#dmG)"/>
  <g font-size="9" fill="#83c167" text-anchor="middle">
    <text x="220" y="344">stays</text>
    <text x="640" y="344">stays</text>
  </g>
  <!-- mover and the displaced a -->
  <path d="M 360 376 C 398 336, 462 336, 500 376" fill="none" stroke="#58c4dd" stroke-width="1.5" marker-end="url(#dmB)"/>
  <path d="M 492 376 C 462 354, 398 354, 368 376" fill="none" stroke="#888888" stroke-width="1.4" marker-end="url(#dmS)"/>

  <!-- chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="170" y="380" width="100" height="36" rx="5" fill="#1c2a16" stroke="#83c167" stroke-width="1.8"/>
    <text x="220" y="403" fill="#83c167">v &#8594; 0 &#10003;</text>
    <rect x="310" y="380" width="100" height="36" rx="5" fill="#17313d" stroke="#58c4dd" stroke-width="1.8"/>
    <text x="360" y="403" fill="#58c4dd">v &#8594; 2</text>
    <rect x="450" y="380" width="100" height="36" rx="5" fill="#222222" stroke="#444444" stroke-width="1.5"/>
    <text x="500" y="403" fill="#dddddd">a &#8594; 1</text>
    <rect x="590" y="380" width="100" height="36" rx="5" fill="#1c2a16" stroke="#83c167" stroke-width="1.8"/>
    <text x="640" y="403" fill="#83c167">v &#8594; 3 &#10003;</text>
    <rect x="730" y="380" width="100" height="36" rx="5" fill="#1c2a16" stroke="#83c167" stroke-width="1.5"/>
    <text x="780" y="403" fill="#83c167">b &#8594; 4 &#10003;</text>
  </g>

  <!-- offsets -->
  <g font-size="9.5" fill="#888888" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="220" y="436">0&#183;bottom</text>
    <text x="360" y="436">1</text>
    <text x="500" y="436">2</text>
    <text x="640" y="436">3</text>
    <text x="780" y="436">4&#183;top</text>
  </g>

  <text x="500" y="464" text-anchor="middle" font-size="11">
    <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#58c4dd">(1 2)</tspan>
    <tspan fill="#bbbbbb"> &#8212; one transposition &#183; 3 exchanges &#183; no v ever lands on another v &#183; same target stack [v a v v b]</tspan>
  </text>

  <!-- ===== why ===== -->
  <line x1="60" y1="486" x2="940" y2="486" stroke="#222222" stroke-width="1"/>
  <g font-size="11.5" fill="#bbbbbb">
    <circle cx="66" cy="508" r="4" fill="#f7d96f"/>
    <text x="80" y="512">the permutation sends the three equal v&#8217;s to the offsets {3 0 2}; as a set of demands, which v serves which is arbitrary</text>
    <circle cx="66" cy="532" r="4" fill="#83c167"/>
    <text x="80" y="536">a slot stays put if an equal slot is destined for the offset it&#8217;s already standing on &#8212; it fills that demand itself</text>
    <circle cx="66" cy="556" r="4" fill="#58c4dd"/>
    <text x="80" y="560">the leftover movers take the leftover vacant offsets, both sides ascending, so equal slots never cross or displace one another</text>
  </g>

  <text x="940" y="622" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">Shuffler.cpp &#183; Emission::permute &#183; deterministic duplicate remapping</text>
</svg>
