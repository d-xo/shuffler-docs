<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrSlate" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="1000" height="700" rx="12" fill="#000000"/>

  <!-- title -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">StackData &amp; StackSlot</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#bbbbbb">the shuffler's in-memory stack &#183; <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">StackData = std::vector&lt;StackSlot&gt;</tspan></text>

  <!-- ===== StackData: vector of slots ===== -->
  <!-- StackOffset (0 = bottom, increases rightward) -->
  <text x="60" y="106" font-size="12" fill="#bbbbbb"><tspan font-weight="700" fill="#dddddd">StackOffset</tspan> &#183; index from the bottom &#183; 0 = bottom &#183; stable as the stack grows</text>
  <line x1="545" y1="102" x2="795" y2="102" stroke="#888888" stroke-width="1.5" marker-end="url(#arrSlate)"/>

  <!-- StackDepth (0 = top, increases leftward) -->
  <text x="60" y="128" font-size="12" fill="#bbbbbb"><tspan font-weight="700" fill="#dddddd">StackDepth</tspan> &#183; distance from the top &#183; 0 = top</text>
  <line x1="795" y1="124" x2="500" y2="124" stroke="#888888" stroke-width="1.5" marker-end="url(#arrSlate)"/>

  <!-- contiguous vector storage -->
  <rect x="60" y="138" width="735" height="48" rx="6" fill="#222222" stroke="#444444" stroke-width="1.5"/>
  <g stroke="#444444" stroke-width="1">
    <line x1="165" y1="138" x2="165" y2="186"/>
    <line x1="270" y1="138" x2="270" y2="186"/>
    <line x1="375" y1="138" x2="375" y2="186"/>
    <line x1="480" y1="138" x2="480" y2="186"/>
    <line x1="585" y1="138" x2="585" y2="186"/>
    <line x1="690" y1="138" x2="690" y2="186"/>
  </g>
  <!-- highlighted slot, zoomed below -->
  <rect x="270" y="138" width="105" height="48" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#dddddd" text-anchor="middle">
    <text x="112" y="166">[0]</text>
    <text x="217" y="166">[1]</text>
    <text x="322" y="166" fill="#ffffff">[2]</text>
    <text x="427" y="166">[3]</text>
    <text x="532" y="166">[4]</text>
    <text x="637" y="166" fill="#888888">&#8943;</text>
    <text x="742" y="166">[n&#8722;1]</text>
  </g>
  <text x="112" y="202" text-anchor="middle" font-size="11" fill="#888888">bottom</text>
  <text x="742" y="202" text-anchor="middle" font-size="11" fill="#888888">top</text>
  <line x1="803" y1="162" x2="850" y2="162" stroke="#888888" stroke-width="1.5" marker-end="url(#arrSlate)"/>
  <text x="858" y="166" font-size="12" fill="#888888">grows</text>
  <text x="940" y="684" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#444444">libyul/backends/evm/ssa/StackSlot.h</text>

  <!-- zoom wedge into one slot -->
  <path d="M 270 188 L 170 334 L 890 334 L 375 188 Z" fill="#58c4dd" opacity="0.05"/>
  <line x1="270" y1="188" x2="170" y2="334" stroke="#444444" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="375" y1="188" x2="890" y2="334" stroke="#444444" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== StackSlot: byte layout ===== -->
  <text x="60" y="360" font-size="16" font-weight="700" fill="#ffffff">StackSlot</text>
  <text x="60" y="380" font-size="11" fill="#888888">8 bytes</text>

  <!-- payload: bytes 0..3 -->
  <rect x="170" y="336" width="360" height="56" rx="4" fill="#17313d" stroke="#58c4dd" stroke-width="1.5"/>
  <text x="350" y="359" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#ffffff">m_payload</text>
  <text x="350" y="378" text-anchor="middle" font-size="11" fill="#bbbbbb">uint32_t &#183; meaning depends on m_kind</text>
  <!-- kind: byte 4 -->
  <rect x="530" y="336" width="90" height="56" rx="4" fill="#241a2e" stroke="#9a72ac" stroke-width="1.5"/>
  <text x="575" y="359" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#ffffff">m_kind</text>
  <text x="575" y="378" text-anchor="middle" font-size="10" fill="#bbbbbb">Kind (u8)</text>
  <!-- valueOpcode: byte 5 -->
  <rect x="620" y="336" width="90" height="56" rx="4" fill="#3a3416" stroke="#f7d96f" stroke-width="1.5"/>
  <text x="665" y="359" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#ffffff">m_valueOpcode</text>
  <text x="665" y="378" text-anchor="middle" font-size="10" fill="#bbbbbb">InstOpcode (u8)</text>
  <!-- padding: bytes 6..7 -->
  <rect x="710" y="336" width="180" height="56" rx="4" fill="#0d0d0d" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="800" y="359" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#888888">padding</text>
  <text x="800" y="378" text-anchor="middle" font-size="10" fill="#888888">unused</text>

  <!-- byte offsets -->
  <g stroke="#444444" stroke-width="1">
    <line x1="170" y1="396" x2="170" y2="402"/>
    <line x1="530" y1="396" x2="530" y2="402"/>
    <line x1="620" y1="396" x2="620" y2="402"/>
    <line x1="710" y1="396" x2="710" y2="402"/>
    <line x1="890" y1="396" x2="890" y2="402"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#888888" text-anchor="middle">
    <text x="170" y="416">0</text>
    <text x="530" y="416">4</text>
    <text x="620" y="416">5</text>
    <text x="710" y="416">6</text>
    <text x="890" y="416">8</text>
  </g>

  <text x="665" y="434" text-anchor="middle" font-size="11.5" fill="#c78d46">cached opcode of the defining Inst &#183; meaningful only for Kind::Value</text>
  <text x="420" y="456" text-anchor="middle" font-size="12" fill="#bbbbbb"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">static_assert</tspan>: sizeof == 8 &#183; trivial &#183; trivially copyable &#183; standard layout</text>

  <!-- ===== interpretation by kind ===== -->
  <g font-size="12" font-weight="700">
    <text x="70" y="492" fill="#9a72ac">m_kind (u8)</text>
    <text x="340" y="492" fill="#58c4dd">m_payload (u32)</text>
    <text x="680" y="492" fill="#f7d96f">m_valueOpcode (u8)</text>
  </g>
  <line x1="60" y1="502" x2="940" y2="502" stroke="#444444" stroke-width="1"/>

  <g font-size="12">
    <!-- Value -->
    <circle cx="56" cy="521" r="4" fill="none" stroke="#83c167" stroke-width="1.5"/>
    <text x="70" y="525" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ffffff">Value = 0</text>
    <text x="340" y="525" fill="#dddddd">InstId &#8212; the defining instruction</text>
    <text x="680" y="525" fill="#dddddd">its opcode &#183; Const &#8658; literal, Phi &#8658; phi</text>
    <line x1="60" y1="537" x2="940" y2="537" stroke="#222222" stroke-width="1"/>
    <!-- Junk -->
    <circle cx="56" cy="553" r="4" fill="#83c167"/>
    <text x="70" y="557" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ffffff">Junk = 1</text>
    <text x="340" y="557" fill="#dddddd">unused (0) &#8212; wildcard, may hold anything</text>
    <text x="680" y="557" fill="#888888">Unreachable &#183; unused</text>
    <line x1="60" y1="569" x2="940" y2="569" stroke="#222222" stroke-width="1"/>
    <!-- FunctionCallReturnLabel -->
    <circle cx="56" cy="585" r="4" fill="#83c167"/>
    <text x="70" y="589" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ffffff">FunctionCallReturnLabel = 2</text>
    <text x="340" y="589" fill="#dddddd">CallSiteID &#8212; index into the layout's call sites</text>
    <text x="680" y="589" fill="#888888">Unreachable &#183; unused</text>
    <line x1="60" y1="601" x2="940" y2="601" stroke="#222222" stroke-width="1"/>
    <!-- FunctionReturnLabel -->
    <text x="70" y="621" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ffffff">FunctionReturnLabel = 3</text>
    <text x="340" y="621" fill="#dddddd">FunctionGraphID &#8212; the function's graph</text>
    <text x="680" y="621" fill="#888888">Unreachable &#183; unused</text>
  </g>

  <!-- footnote -->
  <circle cx="66" cy="656" r="4" fill="#83c167"/>
  <text x="76" y="660" font-size="11.5" fill="#bbbbbb">/ <tspan fill="#83c167">&#9675;</tspan>&#160; freely generable (<tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">canBeFreelyGenerated</tspan>) &#8212; can be materialized on the stack top without an existing copy &#183; &#9675; only when the Value is a literal (Const)</text>
</svg>
