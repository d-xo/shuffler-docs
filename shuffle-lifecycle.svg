<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="mB" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="12" fill="#0f172a"/>

  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#f1f5f9">The Shuffler, Start to Finish</text>
  <text x="450" y="60" text-anchor="middle" font-size="11.5" fill="#94a3b8">source [x c b a] &#8594; target [c b a] &#183; swap reach drawn as 2 &#183; one blocked attempt, one compression, then success</text>

  <!-- phase banner -->
  <g font-size="13.5" font-weight="700">
    <text x="60" y="105" fill="#e2e8f0" opacity="1">1 &#183; mapping &#8212; connect source slots to target slots<animate attributeName="opacity" values="1;0" keyTimes="0;.1" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#e2e8f0" opacity="0">2 &#183; excess removal &#8212; pop the surplus x<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1;.1667" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#f87171" opacity="0">&#10007; blocked &#8212; x is at depth 3, swap reach is 2<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1667;.25" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#fbbf24" opacity="0">4 &#183; compression &#8212; drop c (a literal, cheap to regenerate), restart<animate attributeName="opacity" values="0;1;0" keyTimes="0;.25;.35" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#e2e8f0" opacity="0">1 &#183; mapping &#8212; b and a retained &#183; c and x now surplus<animate attributeName="opacity" values="0;1;0" keyTimes="0;.35;.4067" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#e2e8f0" opacity="0">2 &#183; excess removal &#8212; both pops now reach<animate attributeName="opacity" values="0;1;0" keyTimes="0;.4067;.5533" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#e2e8f0" opacity="0">3 &#183; permute at lowest height &#8212; b goes home, a parks in c's hole<animate attributeName="opacity" values="0;1;0" keyTimes="0;.5533;.6467" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#e2e8f0" opacity="0">3 &#183; bottom-up generation &#8212; regenerate c, swap it home<animate attributeName="opacity" values="0;1;0" keyTimes="0;.6467;.7733" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="60" y="105" fill="#4ade80" opacity="0">&#10003; done &#8212; the stack matches the target<animate attributeName="opacity" values="0;1" keyTimes="0;.7733" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
  </g>

  <!-- offset labels -->
  <g font-size="9.5" fill="#64748b" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="142" y="344">0</text>
    <text x="142" y="306">1</text>
    <text x="142" y="268">2</text>
    <text x="142" y="230">3</text>
  </g>

  <!-- working stack -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <g transform="translate(150,0)">
      <!-- x : surplus, blocked in attempt 1, popped in attempt 2 -->
      <g transform="translate(0,322)">
        <animateTransform attributeName="transform" type="translate" values="0 322;0 322;0 246;0 246" keyTimes="0;.4933;.5133;1" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;.5333" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
        <rect width="130" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5">
          <animate attributeName="stroke" values="#334155;#f87171" keyTimes="0;.1167" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
        <text x="65" y="22.5" fill="#cbd5e1">x</text>
      </g>
      <!-- c : retained in attempt 1, dropped by compression, popped in attempt 2 -->
      <g transform="translate(0,284)">
        <animateTransform attributeName="transform" type="translate" values="0 284;0 284;0 208;0 208" keyTimes="0;.42;.44;1" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;.46" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
        <rect width="130" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5">
          <animate attributeName="stroke" values="#334155;#f87171" keyTimes="0;.25" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
        <text x="65" y="22.5" fill="#cbd5e1">c</text>
      </g>
      <!-- b -->
      <g transform="translate(0,246)">
        <animateTransform attributeName="transform" type="translate" values="0 246;0 246;0 322;0 322;0 284;0 284" keyTimes="0;.4933;.5133;.58;.6;1" dur="24s" repeatCount="indefinite"/>
        <rect width="130" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="65" y="22.5" fill="#cbd5e1">b</text>
      </g>
      <!-- a -->
      <g transform="translate(0,208)">
        <animateTransform attributeName="transform" type="translate" values="0 208;0 208;0 284;0 284;0 322;0 322;0 246;0 246" keyTimes="0;.42;.44;.58;.6;.72;.74;1" dur="24s" repeatCount="indefinite"/>
        <rect width="130" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="65" y="22.5" fill="#cbd5e1">a</text>
      </g>
      <!-- regenerated c -->
      <g transform="translate(0,246)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 246;0 246;0 322;0 322" keyTimes="0;.72;.74;1" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1" keyTimes="0;.6667" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
        <rect width="130" height="34" rx="5" fill="#12261c" stroke="#4ade80" stroke-width="1.5"/>
        <text x="65" y="22.5" fill="#4ade80">c</text>
      </g>
    </g>
  </g>

  <!-- swap reach line, attempt 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.1;.25" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
    <line x1="140" y1="320" x2="305" y2="320" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="308" y="316" font-size="9" fill="#fbbf24">swap reach &#183; drawn as 2</text>
  </g>
  <text x="288" y="345" font-size="14" font-weight="700" fill="#f87171" opacity="0">&#10007;<animate attributeName="opacity" values="0;1;0" keyTimes="0;.1667;.25" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>

  <!-- mapping arrows -->
  <line x1="282" y1="301" x2="324" y2="339" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mB)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.0167;.1" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
  </line>
  <line x1="282" y1="263" x2="324" y2="301" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mB)" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;.0167;.1;.35;.4067" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
  </line>
  <line x1="282" y1="225" x2="324" y2="263" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mB)" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;.0167;.1;.35;.4067" dur="24s" repeatCount="indefinite" calcMode="discrete"/>
  </line>

  <!-- target ghost -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" text-anchor="middle">
    <rect x="330" y="322" width="100" height="34" rx="5" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="380" y="344" fill="#94a3b8">c</text>
    <rect x="330" y="284" width="100" height="34" rx="5" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="380" y="306" fill="#94a3b8">b</text>
    <rect x="330" y="246" width="100" height="34" rx="5" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="380" y="268" fill="#94a3b8">a</text>
  </g>

  <!-- baselines + labels -->
  <line x1="140" y1="360" x2="300" y2="360" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="360" x2="430" y2="360" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <text x="215" y="382" text-anchor="middle" font-size="10.5" fill="#64748b">working stack</text>
  <text x="380" y="382" text-anchor="middle" font-size="10.5" fill="#64748b">target</text>

  <!-- trace panel -->
  <line x1="530" y1="95" x2="530" y2="380" stroke="#1e293b" stroke-width="1"/>
  <text x="560" y="130" font-size="12" font-weight="700" fill="#94a3b8">trace</text>
  <text x="560" y="152" font-size="11" fill="#f87171" opacity="0">attempt 1 &#183; blocked &#8212; nothing emitted<animate attributeName="opacity" values="0;1" keyTimes="0;.1833" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
  <text x="560" y="174" font-size="11" fill="#64748b" opacity="0">attempt 2<animate attributeName="opacity" values="0;1" keyTimes="0;.4067" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5">
    <text x="560" y="196" opacity="0"><tspan fill="#cbd5e1">swap2</tspan><tspan x="650" fill="#64748b" font-size="10.5">bring c up</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.42" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="218" opacity="0"><tspan fill="#cbd5e1">pop</tspan><tspan x="650" fill="#64748b" font-size="10.5">drop c</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.46" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="240" opacity="0"><tspan fill="#cbd5e1">swap2</tspan><tspan x="650" fill="#64748b" font-size="10.5">bring x up</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.4933" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="262" opacity="0"><tspan fill="#cbd5e1">pop</tspan><tspan x="650" fill="#64748b" font-size="10.5">drop x</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.5333" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="284" opacity="0"><tspan fill="#cbd5e1">swap1</tspan><tspan x="650" fill="#64748b" font-size="10.5">b home &#183; a parks</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.58" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="306" opacity="0"><tspan fill="#cbd5e1">push c</tspan><tspan x="650" fill="#64748b" font-size="10.5">regenerate c</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.6667" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="560" y="328" opacity="0"><tspan fill="#cbd5e1">swap2</tspan><tspan x="650" fill="#64748b" font-size="10.5">c home &#183; a floats home</tspan><animate attributeName="opacity" values="0;1" keyTimes="0;.72" dur="24s" repeatCount="indefinite" calcMode="discrete"/></text>
  </g>

  <text x="840" y="408" text-anchor="end" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">Shuffler.cpp &#183; mapping &#8594; excess removal &#8594; realisation &#8594; compression &#183; loops every 24s</text>
</svg>
